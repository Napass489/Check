      }

      /**
       * หน้าต่างระบบหลังบ้าน (Bottom Sheet จากไอคอนฟันเฟืองมุมขวาล่าง — เชื่อม Supabase Auth + สิทธิ์แอดมินจริง)
       */
      function renderAdminModal() {
        const modal = document.getElementById('admin-modal');
        const panel = document.getElementById('admin-modal-panel');
        if (!modal || !panel) return;

        if (!uiState.showAdminModal) {
          modal.classList.add('hidden');
          return;
        }

        // กรณี 1: กำลังตรวจสอบสิทธิ์การเข้าสู่ระบบ
        if (authState.checking) {
          panel.innerHTML = `
            <div class="p-6 text-center space-y-3">
              <div class="flex justify-end">
                <button type="button" id="close-admin-modal-btn" aria-label="ปิดระบบหลังบ้าน" class="w-8 h-8 rounded-full bg-[#FFF4F8] text-cocoa-light hover:text-cocoa flex items-center justify-center cursor-pointer">×</button>
              </div>
              <div class="w-9 h-9 mx-auto rounded-full border-[3px] border-[#F6D0DF] border-t-[#E3638C] animate-spin"></div>
              <div class="font-cute font-semibold text-sm text-cocoa">กำลังตรวจสอบสิทธิ์แอดมิน...</div>
            </div>
          `;
          modal.classList.remove('hidden');
          bindAdminModalEvents();
          return;
        }

        // กรณี 2: ยังไม่ได้เข้าสู่ระบบแอดมิน — แสดงฟอร์มล็อกอินผ่าน Supabase Authentication
        if (!authState.user) {
          panel.innerHTML = `
            <div class="px-4 pt-4 pb-3 border-b border-[#F7E2EC] bg-white flex items-center justify-between">
              <div class="flex items-center gap-2.5">
                <span class="w-8 h-8 rounded-full bg-[#FFEAF2] text-[#D85A87] flex items-center justify-center shrink-0">
                  <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                  </svg>
                </span>
                <div>
                  <h2 id="admin-modal-title" class="font-cute font-bold text-[15px] text-cocoa leading-tight">เข้าสู่ระบบหลังบ้าน</h2>
                  <p class="text-[10px] text-cocoa-light">เฉพาะแอดมินที่ได้รับอนุญาตเท่านั้น</p>
                </div>
              </div>
              <button type="button" id="close-admin-modal-btn" aria-label="ปิดหน้าต่าง" class="w-8 h-8 rounded-full bg-[#FFF4F8] text-cocoa-light hover:text-cocoa flex items-center justify-center cursor-pointer">×</button>
            </div>

            <form id="admin-login-form" class="p-4 space-y-3">
              <div class="rounded-2xl bg-[#FFF6FA] border border-[#F6DCE7] p-3 text-[11px] text-cocoa-light leading-relaxed">
                กรุณาใช้อีเมลและรหัสผ่านบัญชีแอดมินที่สร้างไว้ใน <strong class="text-[#C84A76]">Supabase Authentication</strong> เพื่อจัดการคิวและตั้งค่าร้านค่ะ
              </div>

              <div>
                <label for="admin-login-email" class="block font-cute font-semibold text-xs text-cocoa mb-1">อีเมลแอดมิน</label>
                <input id="admin-login-email" name="email" type="email" required autocomplete="email" placeholder="admin@example.com" class="clean-input w-full px-3 py-2.5 rounded-xl text-cocoa focus:outline-none" />
              </div>

              <div>
                <label for="admin-login-password" class="block font-cute font-semibold text-xs text-cocoa mb-1">รหัสผ่าน</label>
                <input id="admin-login-password" name="password" type="password" required autocomplete="current-password" placeholder="กรอกรหัสผ่าน" class="clean-input w-full px-3 py-2.5 rounded-xl text-cocoa focus:outline-none" />
              </div>

              ${
                authState.loginError
                  ? `<div role="alert" class="rounded-xl bg-[#FFF0F5] border border-[#F3C2D3] px-3 py-2 text-xs text-[#C23B67] font-medium">${escapeHtml(authState.loginError)}</div>`
                  : ''
              }

              <button
                type="submit"
                ${uiState.isSaving ? 'disabled' : ''}
                class="btn-rose-solid w-full py-3 rounded-full font-cute text-sm font-semibold cursor-pointer disabled:opacity-60">
                ${uiState.isSaving ? 'กำลังเข้าสู่ระบบ...' : 'เข้าสู่ระบบแอดมิน'}
              </button>
            </form>
          `;
          modal.classList.remove('hidden');
          bindAdminModalEvents();
          return;
        }

        // กรณี 3: ล็อกอินแล้วแต่ไม่มีสิทธิ์ในตาราง queue_app_admins
        if (!authState.isAdmin) {
          panel.innerHTML = `
            <div class="px-4 pt-4 pb-3 border-b border-[#F7E2EC] bg-white flex items-center justify-between">
              <h2 id="admin-modal-title" class="font-cute font-bold text-[15px] text-cocoa">ไม่มีสิทธิ์ผู้ดูแลระบบ</h2>
              <button type="button" id="close-admin-modal-btn" aria-label="ปิดหน้าต่าง" class="w-8 h-8 rounded-full bg-[#FFF4F8] text-cocoa-light hover:text-cocoa flex items-center justify-center cursor-pointer">×</button>
            </div>
            <div class="p-5 text-center space-y-3">
              <div class="flex justify-center">${getBunnySvg('pink', 'w-14 h-14')}</div>
              <div class="font-cute font-semibold text-sm text-[#C23B67]">บัญชีนี้ยังไม่ได้รับสิทธิ์แอดมินค่ะ</div>
              <div class="rounded-xl bg-[#FFF6FA] border border-[#F5DCE7] p-2.5 text-[11px] text-cocoa-light break-all">
                อีเมล: <strong class="text-cocoa">${escapeHtml(authState.user.email || '-')}</strong><br />
                UID: <code class="text-[10px] text-[#C84A76]">${escapeHtml(authState.user.id || '')}</code>
              </div>
              <button type="button" id="admin-logout-btn" class="btn-rose-solid w-full py-2.5 rounded-full font-cute text-xs font-semibold cursor-pointer">
                ออกจากระบบเพื่อเปลี่ยนบัญชี
              </button>
            </div>
          `;
          modal.classList.remove('hidden');
          bindAdminModalEvents();
          return;
        }

        // กรณี 4: แอดมินที่ผ่านการยืนยันตัวตนแล้ว — แสดงเครื่องมือจัดการหลังบ้านครบ 3 แท็บ
        const savingBannerHtml = uiState.isSaving
          ? `
            <div class="rounded-xl bg-[#FFF2F7] border border-[#F5CBE0] px-3 py-2 flex items-center justify-center gap-2 text-xs font-cute text-[#C84A76]">
              <span class="w-3.5 h-3.5 rounded-full border-2 border-[#F4BDD3] border-t-[#E3638C] animate-spin inline-block"></span>
              <span>กำลังบันทึกข้อมูลลง Supabase...</span>
            </div>
          `
          : '';

        // 1) แท็บจัดการคิว
        const renderQueuesTab = () => {
          const shareQueue = uiState.sharingQueueCode ? findQueueByCode(uiState.sharingQueueCode) : null;

            ? (() => {
                const directLink = buildQueueDirectLink(shareQueue.code);
                const formattedMessage = formatShareMessage(shareQueue);

                      <div class="font-cute font-bold text-xs text-[#C84A76]">

                      <button type="button" id="close-share-box-btn" class="text-[11px] font-cute text-cocoa-light hover:text-cocoa cursor-pointer">ปิด</button>
                    </div>

                    <div class="flex gap-1.5">
                      <input id="share-direct-link-input" type="text" readonly value="${escapeHtml(directLink)}" class="clean-input flex-1 min-w-0 px-2.5 py-1.5 rounded-xl bg-white text-cocoa" />
                      <button type="button" id="copy-direct-link-btn" class="px-3 py-1.5 rounded-xl bg-white border border-[#F2C6D8] font-cute text-xs font-semibold text-[#C84A76] shrink-0 cursor-pointer">
                        คัดลอกลิงก์
                      </button>
                    </div>

                    <div>
                      <div class="flex items-center justify-between mb-1">
                        <label for="share-message-textarea" class="text-[11px] font-cute font-semibold text-cocoa">ฟอร์มข้อความส่งลูกค้า (แก้ก่อนคัดลอกได้)</label>
                        <button type="button" id="toggle-inline-tpl-btn" class="text-[10px] font-cute font-semibold text-[#D6547E] underline cursor-pointer">
                          ${uiState.showInlineTemplateEdit ? 'ซ่อนฟอร์มหลัก' : 'แก้ไขฟอร์มหลัก'}
                        </button>
                      </div>
                      <textarea id="share-message-textarea" rows="5" class="clean-input w-full p-2.5 rounded-xl bg-white text-cocoa leading-relaxed">${escapeHtml(formattedMessage)}</textarea>
                    </div>

                    ${
                      uiState.showInlineTemplateEdit
                        ? `
                          <div class="rounded-xl bg-white border border-[#F4D1E0] p-2.5 space-y-2">
                            <div class="text-[11px] font-cute font-semibold text-[#C84A76]">แก้ไขเทมเพลตฟอร์มหลัก</div>
                            <div class="flex flex-wrap gap-1">
                              ${['{customer}', '{code}', '{service}', '{dueDate}', '{step}', '{details}', '{link}']
                                .map(
                                  (v) =>
                                    `<button type="button" data-insert-var="${v}" data-target-id="inline-master-tpl" class="px-2 py-0.5 rounded-full bg-[#FFF2F7] border border-[#F4CFE0] text-[10px] font-cute text-[#C84A76] cursor-pointer">${v}</button>`
                                )
                                .join('')}
                            </div>
                            <textarea id="inline-master-tpl" rows="4" class="clean-input w-full p-2 rounded-xl text-cocoa">${escapeHtml(appData.shareTemplate)}</textarea>
                            <button type="button" id="save-inline-tpl-btn" ${uiState.isSaving ? 'disabled' : ''} class="btn-rose-solid w-full py-1.5 rounded-xl font-cute text-xs font-semibold cursor-pointer disabled:opacity-60">
                              ${uiState.isSaving ? 'กำลังบันทึก...' : 'บันทึกฟอร์มหลัก'}
                            </button>
                          </div>
                        `
                        : ''
                    }

                    <div class="grid grid-cols-2 gap-2">
                      <button type="button" id="copy-share-msg-btn" class="btn-rose-solid py-2 px-3 rounded-xl font-cute text-xs font-semibold cursor-pointer">
                        คัดลอกฟอร์ม + ลิงก์
                      </button>
                      <button type="button" id="test-open-share-link-btn" data-open-code="${escapeHtml(shareQueue.code)}" class="py-2 px-3 rounded-xl bg-white border border-[#F2C6D8] text-cocoa font-cute text-xs font-semibold cursor-pointer">
                        ทดลองเปิดลิงก์นี้
                      </button>
                    </div>
                  </div>
                `;
              })()
            : '';

          if (appData.queues.length === 0) {
            return `
              <div class="space-y-3">
                ${savingBannerHtml}
                <div class="rounded-2xl bg-white border border-[#F5DCE7] p-6 text-center space-y-2.5">
                  <div class="flex justify-center">${getBunnySvg('pink', 'w-12 h-12')}</div>
                  <div class="font-cute font-semibold text-sm text-cocoa">ยังไม่มีคิวในฐานข้อมูล Supabase ค่ะ</div>
                  <p class="text-[11px] text-cocoa-light">กดปุ่มด้านล่างเพื่อเพิ่มคิวจริงรายการแรกได้เลยนะคะ</p>
                  <button type="button" data-admin-tab="add" class="btn-rose-solid px-5 py-2 rounded-full font-cute text-xs font-semibold cursor-pointer">
                    + เพิ่มคิวแรกเลย
                  </button>
                </div>
              </div>
            `;
          }

          return `
            <div class="space-y-3">
              ${savingBannerHtml}
              ${shareBoxHtml}
              <div class="space-y-2.5">
                ${appData.queues
                  .map((q, idx) => {
                    const isEditing = uiState.editingQueueCode === q.code;
                    const isConfirmDel = uiState.confirmDeleteCode === q.code;
                    const pctValue =
                      typeof q.progressPercent === 'number' && !Number.isNaN(q.progressPercent)
                        ? q.progressPercent
                        : getStatusCategory(q.status) === 'done'
                        ? 100
                        : getStatusCategory(q.status) === 'doing'
                        ? 75
                        : 40;

                    return `
                      <div class="rounded-2xl bg-white border border-[#F5DCE7] p-3 space-y-2.5">
                        <div class="flex items-center justify-between gap-2">
                          <div class="flex items-center gap-2 min-w-0">
                            ${renderQueueAvatar(q, 'pink', 'w-8 h-8')}
                            <div class="min-w-0">
                              <div class="font-cute font-bold text-sm text-cocoa leading-tight truncate">
                                ${escapeHtml(q.code)} ${q.customerName ? `• ${escapeHtml(q.customerName)}` : ''}
                              </div>
                              <div class="text-[11px] text-cocoa-light truncate">
                                ส่ง: ${escapeHtml(q.dueDate || 'ตามลำดับคิว')}
                              </div>
                            </div>
                          </div>

                          <select
                            data-demo-status-idx="${idx}"
                            ${uiState.isSaving ? 'disabled' : ''}
                            aria-label="เปลี่ยนสถานะคิว ${escapeHtml(q.code)}"
                            class="font-cute bg-[#FFF8FB] border border-[#ECCBD7] rounded-xl px-2 py-1 text-cocoa focus:outline-none focus:border-[#EE79A3] shrink-0 disabled:opacity-60">
                            ${appData.statusOptions
                              .map(
                                (st) =>
                                  `<option value="${escapeHtml(st.id)}" ${q.status === st.id ? 'selected' : ''}>${escapeHtml(st.label)}</option>`
                              )
                              .join('')}
                          </select>
                        </div>

                        <div class="flex flex-wrap items-center gap-1.5">
                          <button type="button" data-toggle-edit="${escapeHtml(q.code)}" class="px-2.5 py-1 rounded-xl bg-[#FFF3F8] hover:bg-[#FFE6F0] text-[#C84A76] font-cute text-[11px] font-medium cursor-pointer">
                            ${isEditing ? 'ซ่อนฟอร์ม' : 'อัปเดตคืบหน้า'}
                          </button>
                          <button type="button" data-open-share="${escapeHtml(q.code)}" class="px-2.5 py-1 rounded-xl bg-[#F6F0FF] hover:bg-[#ECE2FF] text-[#784BC2] font-cute text-[11px] font-medium cursor-pointer">
                            ลิงก์คิว / ฟอร์ม
                          </button>
                          <button type="button" data-delete-queue="${escapeHtml(q.code)}" ${uiState.isSaving ? 'disabled' : ''} class="ml-auto px-2.5 py-1 rounded-xl ${
                            isConfirmDel ? 'bg-[#E04F7B] text-white' : 'bg-[#FFF5F7] text-[#C85478]'
                          } font-cute text-[11px] font-medium cursor-pointer disabled:opacity-60">
                            ${isConfirmDel ? 'แตะซ้ำเพื่อลบ' : 'ลบ'}
                          </button>
                        </div>

                        ${
                          isEditing
                            ? `
                              <form data-edit-queue-idx="${idx}" class="pt-2.5 border-t border-dashed border-[#F3D5E2] space-y-2.5">
                                <div class="grid grid-cols-2 gap-2">
                                  <div>
                                    <label class="block text-[10px] font-cute text-cocoa-light mb-0.5">ชื่อลูกค้า</label>
                                    <input type="text" name="customerName" value="${escapeHtml(q.customerName || '')}" placeholder="ชื่อลูกค้า" class="clean-input w-full px-2.5 py-1.5 rounded-xl text-cocoa focus:outline-none" />
                                  </div>
                                  <div>
                                    <label class="block text-[10px] font-cute text-cocoa-light mb-0.5">กำหนดส่งงาน</label>
                                    <input type="text" name="dueDate" value="${escapeHtml(q.dueDate || '')}" placeholder="เช่น 28 พ.ย." class="clean-input w-full px-2.5 py-1.5 rounded-xl text-cocoa focus:outline-none" />
                                  </div>
                                </div>

                                <div>
                                  <label class="block text-[10px] font-cute text-cocoa-light mb-0.5">รายการ</label>
                                  <input type="text" name="service" value="${escapeHtml(q.service || '')}" placeholder="ชื่อรายการงาน" class="clean-input w-full px-2.5 py-1.5 rounded-xl text-cocoa focus:outline-none" />
                                </div>

                                <div>
                                  <label class="block text-[10px] font-cute text-cocoa-light mb-0.5">ขั้นตอนงานตอนนี้</label>
                                  <input type="text" name="workStep" value="${escapeHtml(q.workStep || '')}" placeholder="กำลังทำถึงขั้นตอนไหน" class="clean-input w-full px-2.5 py-1.5 rounded-xl text-cocoa focus:outline-none" />
                                  <div class="flex flex-wrap gap-1 mt-1.5">
                                    ${QUICK_WORK_STEPS.map(
                                      (st) =>
                                        `<button type="button" data-quick-step="${escapeHtml(st)}" class="px-2 py-0.5 rounded-full bg-[#FFF4F8] border border-[#F4D2E1] text-[10px] font-cute text-[#C6537C] cursor-pointer">${escapeHtml(st)}</button>`
                                    ).join('')}
                                  </div>

      /* =======================================================================
         5.5) ระบบเสียงเพลงกล่องดนตรี (Tone.js + Web Audio Fallback)
              และหน้าดาวน์โหลดน่ารัก ๆ (หน้าโหลดเข้าเว็บ + บัตรคิว PNG)
         ======================================================================= */
      const CuteMusicBox = (() => {
        let isPlaying = false;
        let stepIdx = 0;
        let loopTimer = null;
        let audioCtx = null;
        let toneSynth = null;

        const melody = [
          { note: 'C5', freq: 523.25 },
          { note: 'E5', freq: 659.25 },
          { note: 'G5', freq: 783.99 },
          { note: 'B5', freq: 987.77 },
          { note: 'A5', freq: 880.0 },
          { note: 'G5', freq: 783.99 },
          { note: 'E5', freq: 659.25 },
          { note: 'D5', freq: 587.33 },
          { note: 'F5', freq: 698.46 },
          { note: 'A5', freq: 880.0 },
          { note: 'C6', freq: 1046.5 },
          { note: 'A5', freq: 880.0 },
          { note: 'G5', freq: 783.99 },
          { note: 'E5', freq: 659.25 },
          { note: 'D5', freq: 587.33 },
          { note: null, freq: 0 },
        ];

        function playNoteFallback(freq, durationSec = 0.42, gainLevel = 0.055) {
          if (!freq) return;
          try {
            const Ctx = window.AudioContext || window.webkitAudioContext;
            if (!Ctx) return;
            if (!audioCtx) audioCtx = new Ctx();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, now);
            gain.gain.setValueAtTime(0.001, now);
            gain.gain.exponentialRampToValueAtTime(gainLevel, now + 0.025);
            gain.gain.exponentialRampToValueAtTime(0.0008, now + durationSec);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now);
            osc.stop(now + durationSec + 0.02);
          } catch (err) {
            console.warn('Web Audio fallback error:', err);
          }
        }

        function triggerSingleNote(item) {
          if (!item || !item.freq) return;
          if (window.Tone && toneSynth) {
            try {
              toneSynth.triggerAttackRelease(item.note, '8n');
              return;
            } catch (err) {
              // fallback ด้านล่าง
            }
          }
          playNoteFallback(item.freq, 0.46, 0.05);
        }

        async function start() {
          if (isPlaying) return;
          isPlaying = true;
          uiState.musicPlaying = true;
          updateMusicButtonUi();

          // ปลดล็อกเสียง Web Audio ทันทีในจังหวะแตะหน้าจอ (รองรับ Safari บน iPhone/iPad)
          try {
            const Ctx = window.AudioContext || window.webkitAudioContext;
            if (Ctx) {
              if (!audioCtx) audioCtx = new Ctx();
              if (audioCtx.state === 'suspended') {
                audioCtx.resume().catch(() => {});
              }
            }
          } catch (err) {
            // ข้ามหากเบราว์เซอร์ไม่รองรับ
          }

          // เล่นโน้ตแรกทันทีเพื่อให้มีเสียงออกทันทีเมื่อแตะหน้าจอ
          triggerSingleNote(melody[stepIdx % melody.length]);
          stepIdx = (stepIdx + 1) % melody.length;

          clearInterval(loopTimer);
          loopTimer = setInterval(() => {
            if (!isPlaying) return;
            triggerSingleNote(melody[stepIdx % melody.length]);
            stepIdx = (stepIdx + 1) % melody.length;
          }, 420);

          if (window.Tone) {
            try {
              await window.Tone.start();
              if (!toneSynth) {
                toneSynth = new window.Tone.PolySynth(window.Tone.Synth, {
                  oscillator: { type: 'triangle' },
                  envelope: { attack: 0.02, decay: 0.25, sustain: 0.08, release: 0.7 },
                }).toDestination();
                toneSynth.volume.value = -16;
              }
            } catch (err) {
              toneSynth = null;
            }
          }
        }

        function stop() {
          isPlaying = false;
          uiState.musicPlaying = false;
          clearInterval(loopTimer);
          loopTimer = null;
          updateMusicButtonUi();
        }

        function toggle() {
          if (isPlaying) {
            stop();
            showToast('ปิดเสียงเพลงแล้วค่ะ');
          } else {
            start();
            showToast('เปิดเสียงเพลงกล่องดนตรีแล้วค่ะ 🎵');
          }
        }

        function playCuteChime() {
          if (!isPlaying) return;
          playNoteFallback(1046.5, 0.18, 0.045);
          setTimeout(() => playNoteFallback(1318.5, 0.24, 0.04), 90);
        }

        return { toggle, start, stop, playCuteChime };
      })();

      /**
       * ลูกเล่นแสงฟุ้งพาสเทลเวลาแตะหน้าจอ (ใช้แสงเบลอ วงแสง และประกาย SVG ไม่มีอิโมจิ)
       */
      function spawnTapMistEffect(clientX, clientY) {
        const layer = document.getElementById('tap-mist-layer');
        if (!layer || typeof clientX !== 'number' || typeof clientY !== 'number') return;

        // 1) แสงฟุ้งละมุนตรงจุดที่แตะ
        const aura = document.createElement('span');
        aura.className = 'tap-mist-aura';
        aura.style.left = `${clientX}px`;
        aura.style.top = `${clientY}px`;
        layer.appendChild(aura);

        // 2) วงแหวนแสงบาง ๆ ขยายออก
        const ring = document.createElement('span');
        ring.className = 'tap-mist-ring';
        ring.style.left = `${clientX}px`;
        ring.style.top = `${clientY}px`;
        layer.appendChild(ring);

        // 3) ละอองแสงกลมฟุ้งกระจายรอบจุดแตะ
        const orbCount = 5;
        for (let i = 0; i < orbCount; i += 1) {
          const orb = document.createElement('span');
          const angle = (Math.PI * 2 * i) / orbCount + (Math.random() * 0.7 - 0.35);
          const dist = 22 + Math.random() * 24;
          const size = 7 + Math.random() * 7;
          orb.className = 'tap-mist-orb';
          orb.style.left = `${clientX}px`;
          orb.style.top = `${clientY}px`;
          orb.style.width = `${size}px`;
          orb.style.height = `${size}px`;
          orb.style.setProperty('--dx', `${Math.cos(angle) * dist}px`);
          orb.style.setProperty('--dy', `${Math.sin(angle) * dist - 8}px`);
          layer.appendChild(orb);
          setTimeout(() => orb.remove(), 820);
        }

        // 4) ประกาย 4 แฉกพาสเทลแบบ SVG 2 ดวง (ไม่ใช้อิโมจิ)
        for (let j = 0; j < 2; j += 1) {
          const spark = document.createElement('span');
          const angle = Math.random() * Math.PI * 2;
          const dist = 18 + Math.random() * 20;
          const sz = 10 + Math.random() * 5;
          spark.className = 'tap-mist-spark';
          spark.style.left = `${clientX}px`;
          spark.style.top = `${clientY}px`;
          spark.style.setProperty('--dx', `${Math.cos(angle) * dist}px`);
          spark.style.setProperty('--dy', `${Math.sin(angle) * dist - 10}px`);
          spark.innerHTML = `<svg width="${sz}" height="${sz}" viewBox="0 0 24 24" fill="none"><path d="M12 2L14.3 9.7L22 12L14.3 14.3L12 22L9.7 14.3L2 12L9.7 9.7L12 2Z" fill="${j === 0 ? '#FF9AC0' : '#FFFFFF'}"/></svg>`;
          layer.appendChild(spark);
          setTimeout(() => spark.remove(), 860);
        }

        setTimeout(() => {
          aura.remove();
          ring.remove();
        }, 820);
      }

      function downloadQueueCardPng(queue, details, statusMeta) {
        try {
          const canvas = document.createElement('canvas');
          canvas.width = 760;
          canvas.height = 920;
          const ctx = canvas.getContext('2d');
          if (!ctx) return;

          const bgGrad = ctx.createLinearGradient(0, 0, 0, canvas.height);
          bgGrad.addColorStop(0, '#FFE6F0');
          bgGrad.addColorStop(0.5, '#FFF5F9');
          bgGrad.addColorStop(1, '#FCE4EE');
          ctx.fillStyle = bgGrad;
          ctx.fillRect(0, 0, canvas.width, canvas.height);

          const drawRoundRect = (x, y, w, h, r) => {
            ctx.beginPath();
            ctx.moveTo(x + r, y);
            ctx.arcTo(x + w, y, x + w, y + h, r);
            ctx.arcTo(x + w, y + h, x, y + h, r);
            ctx.arcTo(x, y + h, x, y, r);
            ctx.arcTo(x, y, x + w, y, r);
            ctx.closePath();
          };

          drawRoundRect(56, 56, 648, 808, 46);
          ctx.fillStyle = '#FFFFFF';
          ctx.fill();
          ctx.lineWidth = 4;
          ctx.strokeStyle = '#F7C9DC';
          ctx.stroke();

          ctx.textAlign = 'center';
          ctx.fillStyle = '#D45C88';
          ctx.font = '600 26px "Prompt", sans-serif';
          ctx.fillText(`♡  ${appData.shopName || 'ร้านเช็กคิวน้องกระต่าย'}  ♡`, 380, 128);

          ctx.fillStyle = '#967274';
          ctx.font = '500 24px "Prompt", sans-serif';
          ctx.fillText(queue.customerName ? `บัตรคิวของ ${queue.customerName}` : 'บัตรคิวของคุณ', 380, 190);

          ctx.fillStyle = '#5C2F2B';
          ctx.font = '700 88px "Mitr", "Prompt", sans-serif';
          ctx.fillText(queue.code, 380, 292);

          drawRoundRect(235, 326, 290, 56, 28);
          ctx.fillStyle = statusMeta.hexBg || '#FCE7EF';
          ctx.fill();
          ctx.fillStyle = statusMeta.hexText || '#C84A76';
          ctx.font = '600 26px "Prompt", sans-serif';
          ctx.fillText(`${statusMeta.label} • ${details.progressPercent}%`, 380, 363);

          ctx.setLineDash([10, 10]);
          ctx.beginPath();
          ctx.moveTo(110, 424);
          ctx.lineTo(650, 424);
          ctx.strokeStyle = '#F3CCE0';
          ctx.lineWidth = 3;
          ctx.stroke();
          ctx.setLineDash([]);

          const rows = [
            ['รายการ', queue.service || 'งานตกแต่งคิวมาตรฐาน'],
            ['กำหนดส่งงาน', queue.dueDate || 'ตามลำดับคิว'],
            ['ขั้นตอนตอนนี้', queue.workStep || details.currentStageLabel],
            ['สถานะลำดับ', details.currentStageLabel],
            ['อัปเดตล่าสุด', queue.updatedAt || 'วันนี้'],
          ];

          let yPos = 490;
          rows.forEach(([label, val]) => {
            ctx.textAlign = 'left';
            ctx.fillStyle = '#967274';
            ctx.font = '500 23px "Prompt", sans-serif';
            ctx.fillText(label, 110, yPos);

            ctx.textAlign = 'right';
            ctx.fillStyle = '#5C2F2B';
            ctx.font = '600 23px "Prompt", sans-serif';
            const textVal = String(val || '-');
            ctx.fillText(textVal.length > 26 ? `${textVal.slice(0, 25)}…` : textVal, 650, yPos);
            yPos += 62;
          });

          ctx.textAlign = 'center';
          ctx.fillStyle = '#D96691';
          ctx.font = '500 21px "Prompt", sans-serif';
          ctx.fillText('ขอบคุณที่ไว้วางใจและรอคิวนะคะ ♡', 380, 818);

          const link = document.createElement('a');
          link.download = `queue-${queue.code}.png`;
          link.href = canvas.toDataURL('image/png');
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);
          CuteMusicBox.playCuteChime();
          showToast(`ดาวน์โหลดบัตรคิว ${queue.code} แล้วค่ะ 🎀`);
        } catch (err) {
          console.warn('ไม่สามารถดาวน์โหลดบัตรคิว PNG:', err);
          showToast('ไม่สามารถสร้างรูปได้ กรุณาลองคัดลอกข้อมูลคิวแทนนะคะ');
        }
      }

          uiState.searchError = `กรุณากรอกรหัสคิวก่อนค้นหานะคะ (เช่น ${hintCode})`;

          renderApp();
          const inputEl = document.getElementById('queue-code-input');

          return;

        const matchedQueue = findQueueByCode(normalized);
        if (!matchedQueue) {
          uiState.searchInputValue = rawValue.trim();

          if (inputEl) inputEl.focus();
          return;

      function bindPageEvents() {

        // --- อีเวนต์หน้าเช็กคิว ---
        const form = document.getElementById('queue-search-form');
        const input = document.getElementById('queue-code-input');

              if (newCat === 'doing') {
                const defaultWaiting = appData.statusOptions.find((s) => s.category === 'waiting') || { id: 'waiting' };
                const otherDoingIds = appData.queues
                  .filter((q) => q.id !== targetQueue.id && getStatusCategory(q.status) === 'doing')

                if (otherDoingIds.length > 0) {
                  const { error: resetDoingErr } = await supabaseClient
                    .from('queue_app_queues')
                    .update({ status_id: defaultWaiting.id })
                    .in('id', otherDoingIds);

              if (newCat === 'done') {

                nextPct = 75;

                .from('queue_app_queues')
                .update({ status_id: newStatus, progress_percent: nextPct })

            const fallbackStatus =

            const details = String(fd.get('details') || '').trim();
            const note = String(fd.get('note') || '').trim();
            const status = String(fd.get('status') || (appData.statusOptions[0] ? appData.statusOptions[0].id : 'waiting'));
            const avatarPreset = String(fd.get('avatarPreset') || 'auto');
            const avatarUrl = String(fd.get('avatarUrl') || '').trim();

            if (!rawCode) {
              showToast('กรุณากรอกรหัสคิวก่อนนะคะ');
              return;
            }
            if (findQueueByCode(rawCode)) {
              showToast(`มีรหัสคิว ${rawCode} อยู่ในระบบแล้ว กรุณาใช้รหัสอื่นนะคะ`);
              return;
            }
            if (avatarUrl && !/^https?:\/\//i.test(avatarUrl)) {
              showToast('ลิงก์รูปตัวคิวต้องขึ้นต้นด้วย https:// นะคะ');
              return;
            }

            runAdminMutation(async () => {
              const newCat = getStatusCategory(status);
              if (newCat === 'doing') {
                const defaultWaiting = appData.statusOptions.find((s) => s.category === 'waiting') || { id: 'waiting' };
                const doingIds = appData.queues
                  .filter((q) => getStatusCategory(q.status) === 'doing')
                  .map((q) => q.id);
                if (doingIds.length > 0) {
                  const { error: moveDoingErr } = await supabaseClient
                    .from('queue_app_queues')
                    .update({ status_id: defaultWaiting.id })
                    .in('id', doingIds);
                  if (moveDoingErr) throw moveDoingErr;
                }
              }

              const nextSortOrder =
                appData.queues.reduce((max, q) => Math.max(max, Number(q.sortOrder || 0)), 0) + 1;

              const { error } = await supabaseClient.from('queue_app_queues').insert({
                code: rawCode,
                status_id: status,
                sort_order: nextSortOrder,
                avatar_preset: avatarPreset,
                avatar_url: avatarUrl,
                customer_name: customerName,
                service: service || 'งานตกแต่งคิวมาตรฐาน',
                due_date: dueDate || 'ตามลำดับคิว',
                work_step: workStep,
                details,
                progress_percent: newCat === 'done' ? 100 : newCat === 'doing' ? 75 : null,
                note,
              });
              if (error) throw error;

              await fetchAllFromSupabase({ silent: true });
              uiState.adminTab = 'queues';
              uiState.sharingQueueCode = rawCode;
              uiState.editingQueueCode = null;
              uiState.showInlineTemplateEdit = false;
              showToast(`เพิ่มคิว ${rawCode} ลง Supabase และสร้างลิงก์ลูกค้าแล้วค่ะ`);
            });
          });
        }

        // แท็บตั้งค่า: ฟอร์มข้อความหลัก
        const settingsTplArea = document.getElementById('settings-template-textarea');
        const settingsTplPreview = document.getElementById('settings-template-preview');
        const saveSettingsTplBtn = document.getElementById('save-settings-template-btn');
        const resetTplBtn = document.getElementById('reset-template-btn');

        if (settingsTplArea && settingsTplPreview) {
          settingsTplArea.addEventListener('input', () => {
            const sampleQueue = appData.queues[appData.queues.length - 1] || {
              code: 'Q-001',
              customerName: 'คุณลูกค้า',
              service: 'งานตกแต่งคิวมาตรฐาน',
              dueDate: 'ตามลำดับคิว',
              workStep: 'รับคิวและบันทึกบรีฟเรียบร้อย',
              details: '-',
            };
            settingsTplPreview.textContent = formatShareMessage(sampleQueue, settingsTplArea.value);
          });
        }

        if (saveSettingsTplBtn && settingsTplArea) {
          saveSettingsTplBtn.addEventListener('click', () => {
            const val = settingsTplArea.value.trim();
            if (!val) {
              showToast('กรุณากรอกฟอร์มข้อความก่อนบันทึกนะคะ');
              return;
            }
            runAdminMutation(async () => {
              const { error } = await supabaseClient
                .from('queue_app_settings')
                .update({ share_template: val })
                .eq('id', 1);
              if (error) throw error;
              appData.shareTemplate = val;
              showToast('บันทึกฟอร์มข้อความลง Supabase เรียบร้อยค่ะ ♡');
            });
          });
        }

        if (resetTplBtn) {
          resetTplBtn.addEventListener('click', () => {
            runAdminMutation(async () => {
              const { error } = await supabaseClient
                .from('queue_app_settings')
                .update({ share_template: DEFAULT_CONFIG.shareTemplate })
                .eq('id', 1);
              if (error) throw error;
              appData.shareTemplate = DEFAULT_CONFIG.shareTemplate;
              showToast('คืนค่าฟอร์มข้อความเริ่มต้นแล้วค่ะ');
            });
          });
        }

        // ตั้งค่ารูปมาสคอตหลักและดูหน้าโหลดอีกครั้ง
        const saveMascotBtn = document.getElementById('save-mascot-url-btn');
        const mascotUrlInput = document.getElementById('demo-mascot-url');
        const resetMascotBtn = document.getElementById('reset-mascot-url-btn');
        const replaySplashBtn = document.getElementById('replay-splash-btn');

        if (saveMascotBtn && mascotUrlInput) {
          saveMascotBtn.addEventListener('click', () => {
            const val = mascotUrlInput.value.trim();
            if (val && !/^https?:\/\//i.test(val)) {
              showToast('กรุณาใส่ลิงก์รูปที่ขึ้นต้นด้วย https:// นะคะ');
              return;
            }
            const nextUrl = val || DEFAULT_CONFIG.mascotImageUrl;
            runAdminMutation(async () => {
              const { error } = await supabaseClient
                .from('queue_app_settings')
                .update({ mascot_image_url: nextUrl })
                .eq('id', 1);
              if (error) throw error;
              appData.mascotImageUrl = nextUrl;
              showToast('อัปเดตรูปมาสคอตลง Supabase เรียบร้อยค่ะ 🎀');
            });
          });
        }

        if (resetMascotBtn) {
          resetMascotBtn.addEventListener('click', () => {
            runAdminMutation(async () => {
              const { error } = await supabaseClient
                .from('queue_app_settings')
                .update({ mascot_image_url: DEFAULT_CONFIG.mascotImageUrl })
                .eq('id', 1);
              if (error) throw error;
              appData.mascotImageUrl = DEFAULT_CONFIG.mascotImageUrl;
              showToast('คืนค่ารูปมาสคอตเริ่มต้นแล้วค่ะ');
            });
          });
        }

        if (replaySplashBtn) {
          replaySplashBtn.addEventListener('click', () => {
            uiState.showAdminModal = false;
            renderAdminModal();
            playCuteSplashLoader();
          });
        }

        // รีเฟรชข้อมูลล่าสุดจากฐานข้อมูล Supabase
        const refreshDbBtn = document.getElementById('admin-refresh-db-btn');
        if (refreshDbBtn) {
          refreshDbBtn.addEventListener('click', async () => {
            const ok = await fetchAllFromSupabase({ silent: true });
            showToast(ok ? 'อัปเดตข้อมูลล่าสุดจาก Supabase แล้วค่ะ ♡' : 'เชื่อมต่อ Supabase ไม่สำเร็จ');
          });
        }
      }

      /**
       * ผูกอีเวนต์ถาวร: เมนูล่าง 3 ปุ่ม, ฟันเฟืองหลังบ้าน, ปุ่มเพลง, หน้าโหลด และป๊อปอัป
       */
      function initNavigation() {
        // แตะหน้าจอแล้วแสดงแสงฟุ้งนุ่ม ๆ (ไม่ใช้อิโมจิ) + เล่นเพลงกล่องดนตรีอัตโนมัติทันทีในครั้งแรก
        let hasAutoStartedMusic = false;
        let lastMistTime = 0;

        const handleFirstTapAudioAndMist = (clientX, clientY, targetEl) => {
          const now = Date.now();
          if (now - lastMistTime > 60) {
            lastMistTime = now;
            spawnTapMistEffect(clientX, clientY);
          }

          const isMusicBtn = targetEl && typeof targetEl.closest === 'function' && targetEl.closest('#music-toggle-btn');
          if (!hasAutoStartedMusic && !isMusicBtn) {
            hasAutoStartedMusic = true;
            if (!uiState.musicPlaying) {
              CuteMusicBox.start();
            }
          }
        };

        document.addEventListener(
          'pointerdown',
          (e) => {
            if (e.isPrimary === false) return;
            handleFirstTapAudioAndMist(e.clientX, e.clientY, e.target);
          },
          { passive: true }
        );

        document.querySelectorAll('[data-nav]').forEach((btn) => {
          btn.addEventListener('click', () => {
            const target = btn.getAttribute('data-nav');
            if (!target) return;
            uiState.activeView = target;
            if (target === 'check') {
              uiState.searchError = '';
            }
            renderApp();
          });
        });

        const gearBtn = document.getElementById('open-admin-gear-btn');
        if (gearBtn) {
          gearBtn.addEventListener('click', () => {
            uiState.showAdminModal = true;
            renderAdminModal();
          });
        }

        const adminModal = document.getElementById('admin-modal');
        if (adminModal) {
          adminModal.addEventListener('click', (e) => {
            if (e.target === adminModal) {
              uiState.showAdminModal = false;
              uiState.confirmDeleteCode = null;
              renderAdminModal();
            }
          });
        }

        window.addEventListener('keydown', (e) => {
          if (e.key === 'Escape') {
            if (uiState.showAdminModal) {
              uiState.showAdminModal = false;
              uiState.confirmDeleteCode = null;
              renderAdminModal();
            }
            if (uiState.downloadModalCode) {
              uiState.downloadModalCode = null;
              renderDownloadCardModal();
            }
          }
        });

        const musicBtn = document.getElementById('music-toggle-btn');
        if (musicBtn) {
          musicBtn.addEventListener('click', () => {
            hasAutoStartedMusic = true;
            CuteMusicBox.toggle();
          });
        }

        const splashEl = document.getElementById('cute-splash-loader');
        if (splashEl) {
          splashEl.addEventListener('click', () => {
            clearInterval(splashTimer);
            splashEl.classList.add('splash-hidden');
          });
        }

        const dlModal = document.getElementById('download-card-modal');
        if (dlModal) {
          dlModal.addEventListener('click', (e) => {
            if (e.target === dlModal) {
              uiState.downloadModalCode = null;
              renderDownloadCardModal();
            }
          });
        }
      }

      /* =======================================================================
         7) เริ่มต้นการทำงานของเว็บแอปและเชื่อมต่อ Supabase เมื่อโหลดหน้าเสร็จ
         ======================================================================= */
      async function initSupabaseApp() {
        await syncAdminSession();

        if (supabaseClient) {
          supabaseClient.auth.onAuthStateChange((_event, session) => {
            syncAdminSession(session);
          });
        }

        const loaded = await fetchAllFromSupabase();
        if (loaded && applyQueueFromUrlIfPresent()) {
          renderApp();
        }
      }

      function startApp() {
        initNavigation();
        uiState.searchInputValue = '';
        renderApp();
        playCuteSplashLoader();
        initSupabaseApp();
      }

      if (document.readyState === 'loading') {
        window.addEventListener('DOMContentLoaded', startApp);
      } else {
        startApp();
      }

      window.addEventListener('hashchange', () => {
        if (applyQueueFromUrlIfPresent()) {
          renderApp();
        }
      });

      // รีเฟรชข้อมูลจากฐานข้อมูลอัตโนมัติเมื่อลูกค้าสลับกลับเข้ามาดูหน้าเว็บ (ไม่ถี่เกิน 15 วินาที)
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible' && Date.now() - lastSyncTimestamp > 15000) {
          fetchAllFromSupabase({ silent: true });
        }
      });
    })();
  </script>
</body>
</html>
