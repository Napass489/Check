<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <!-- ป้องกันหน้าเว็บซูมเองบนมือถือและ iPad (ล็อกสเกลต่ำสุด-สูงสุดและรองรับขอบจอปลอดภัย) -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>เช็กคิวของฉัน — แชทนับถอยหลัง</title>

  <!-- โหลดฟอนต์ภาษาไทยโทนกลมมนอ่านง่าย (Mitr + Prompt) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600;700&family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- โหลด Tone.js สำหรับเสียงเพลงกล่องดนตรีพาสเทล (พร้อมระบบสำรอง Web Audio ในตัว) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>

  <!-- โหลด Supabase JS SDK v2 สำหรับเชื่อมต่อฐานข้อมูลและระบบยืนยันตัวตนแอดมิน -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- โหลด Tailwind CSS สำหรับจัดวางและปรับขนาดตามหน้าจอ -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            cute: ['Mitr', 'Prompt', 'sans-serif'],
            sans: ['Prompt', 'sans-serif'],
          },
          colors: {
            cocoa: '#5C2F2B',
            'cocoa-light': '#967274',
            'cocoa-soft': '#B9989C',
            rosebtn: '#E3638C',
          },
        },
      },
    };
  </script>

  <style>
    /* =========================================================================
       สไตล์หลักธีมชมพูนม ขาวนม และน้ำตาลโกโก้ + ป้องกันเว็บซูมเองบน iOS/iPadOS
       ========================================================================= */
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      overflow-x: hidden;
      font-family: 'Prompt', sans-serif;
      color: #5C2F2B;
      background: radial-gradient(circle at 50% 0%, #FFF9FB 0%, #FFEFF5 58%, #FCE3EE 100%);
      -webkit-text-size-adjust: 100% !important;
      text-size-adjust: 100% !important;
      touch-action: pan-y;
      overscroll-behavior: none;
    }

    #app-shell, #app-content {
      touch-action: pan-y;
      overscroll-behavior-y: contain;
    }

    /* บังคับขนาดฟอนต์ช่องกรอกเป็น 16px เพื่อป้องกัน Safari บน iPhone/iPad ซูมหน้าจออัตโนมัติตอนแตะพิมพ์ */
    input, select, textarea,
    input:focus, select:focus, textarea:focus {
      font-size: 16px !important;
      touch-action: manipulation;
    }

    button, a {
      touch-action: manipulation;
    }

    /* พื้นหลังภายในกรอบแอปโทนชมพูนมละมุน */
    .app-canvas {
      background: linear-gradient(180deg, #FFF7FA 0%, #FFF3F7 52%, #FFF8FA 100%);
    }

    /* ซ่อนสโครลบาร์ให้ดูสะอาดเหมือนแอปมือถือ */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* การ์ดขาวขอบบางเงานุ่ม */
    .clean-card {
      background: #FFFFFF;
      border: 1px solid #F6DDE8;
      box-shadow: 0 8px 24px -14px rgba(194, 118, 148, 0.24);
    }

    /* ช่องกรอกข้อความขอบนุ่ม */
    .clean-input {
      background: #FFFBFD;
      border: 1.5px solid #F3D4E1;
      transition: border-color 0.2s ease, box-shadow 0.2s ease, background-color 0.2s ease;
    }
    .clean-input:focus {
      border-color: #E8709B;
      background: #FFFFFF;
      box-shadow: 0 0 0 3px rgba(238, 121, 163, 0.16);
    }

    /* ปุ่มชมพูกุหลาบแบบทึบละมุน */
    .btn-rose-solid {
      background: linear-gradient(180deg, #F07EA8 0%, #E3638C 100%);
      color: #FFFFFF;
      box-shadow: 0 8px 18px -6px rgba(227, 99, 140, 0.48);
      transition: transform 0.14s ease, filter 0.18s ease, box-shadow 0.18s ease;
    }
    .btn-rose-solid:hover {
      filter: brightness(1.03);
    }
    .btn-rose-solid:active {
      transform: scale(0.985);
      box-shadow: 0 4px 10px -4px rgba(227, 99, 140, 0.45);
    }

    /* แถบชื่อหน้าแบบกระจกฝ้าบนแบนเนอร์ (สไตล์รูปที่ 2) */
    .banner-glass-pill {
      background: rgba(255, 255, 255, 0.86);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.95);
      box-shadow: 0 6px 18px -8px rgba(196, 114, 148, 0.34);
    }

    /* แบนเนอร์ส่วนบนไล่เฟดกลืนลงพื้นหลังชมพูนม */
    .banner-fade-bottom {
      background: linear-gradient(
        180deg,
        rgba(255, 247, 250, 0) 0%,
        rgba(255, 247, 250, 0.25) 48%,
        rgba(255, 247, 250, 0.88) 84%,
        #FFF7FA 100%
      );
    }

    /* เงาอ่อน ๆ สำหรับภาพมาสคอต PNG */
    .mascot-png-shadow {
      filter: drop-shadow(0 8px 14px rgba(196, 118, 148, 0.22));
    }

    /* กล่องคำพูดมาสคอตฝั่งซ้าย (หางชี้ไปทางขวาหามาสคอต) */
    .mascot-speech-cute {
      position: relative;
      background: linear-gradient(180deg, #FFFFFF 0%, #FFF7FA 100%);
      border: 1.5px solid #F6CEE0;
      box-shadow: 0 10px 24px -14px rgba(212, 118, 156, 0.32);
    }
    .mascot-speech-cute::before {
      content: '';
      position: absolute;
      right: -10px;
      top: 50%;
      transform: translateY(-50%);
      width: 0;
      height: 0;
      border-top: 8px solid transparent;
      border-bottom: 8px solid transparent;
      border-left: 10px solid #F6CEE0;
    }
    .mascot-speech-cute::after {
      content: '';
      position: absolute;
      right: -7.5px;
      top: 50%;
      transform: translateY(-50%);
      width: 0;
      height: 0;
      border-top: 6.5px solid transparent;
      border-bottom: 6.5px solid transparent;
      border-left: 8.5px solid #FFF9FB;
    }

    /* กล่องแชทฝั่งซ้าย */
    .chat-pill {
      position: relative;
      background: #FFFFFF;
      border: 1px solid #F5D7E4;
      box-shadow: 0 4px 12px -6px rgba(198, 120, 152, 0.22);
    }
    .chat-pill::before {
      content: '';
      position: absolute;
      left: -7px;
      top: 50%;
      transform: translateY(-50%);
      width: 0;
      height: 0;
      border-top: 5px solid transparent;
      border-bottom: 5px solid transparent;
      border-right: 7px solid #F5D7E4;
    }
    .chat-pill::after {
      content: '';
      position: absolute;
      left: -5.5px;
      top: 50%;
      transform: translateY(-50%);
      width: 0;
      height: 0;
      border-top: 4px solid transparent;
      border-bottom: 4px solid transparent;
      border-right: 6px solid #FFFFFF;
    }

    /* กล่องแชทฝั่งขวา (สลับฝั่งซ้าย-ขวาแบบแชทจริงบนหน้าหลัก) */
    .chat-pill-right {
      position: relative;
      background: linear-gradient(180deg, #FFF7FA 0%, #FFEBF3 100%);
      border: 1px solid #F6CBE0;
      box-shadow: 0 4px 12px -4px rgba(212, 120, 158, 0.2);
    }
    .chat-pill-right::before {
      content: '';
      position: absolute;
      right: -7px;
      top: 50%;
      transform: translateY(-50%);
      width: 0;
      height: 0;
      border-top: 5px solid transparent;
      border-bottom: 5px solid transparent;
      border-left: 7px solid #F6CBE0;
    }
    .chat-pill-right::after {
      content: '';
      position: absolute;
      right: -5.5px;
      top: 50%;
      transform: translateY(-50%);
      width: 0;
      height: 0;
      border-top: 4px solid transparent;
      border-bottom: 4px solid transparent;
      border-left: 6px solid #FFF1F6;
    }

    /* การ์ดไฮไลต์ "กำลังทำ" พื้นชมพูไล่เฉดละมุน */
    .doing-pink-card {
      background: linear-gradient(135deg, #FFE4EE 0%, #FFF2F7 56%, #FFEBF3 100%);
      border: 1.5px solid #F6C6DA;
      box-shadow: 0 10px 24px -14px rgba(227, 99, 140, 0.34);
    }

    /* แถบแสงวิ่งละมุนบน Progress Bar */
    @keyframes shimmerMove {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(220%); }
    }
    .shimmer-bar {
      position: relative;
      overflow: hidden;
    }
    .shimmer-bar::after {
      content: '';
      position: absolute;
      inset: 0;
      width: 45%;
      background: linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.58) 50%, rgba(255,255,255,0) 100%);
      animation: shimmerMove 2.2s ease-in-out infinite;
    }

    /* ไอคอนดอกไม้ขยับเบา ๆ */
    @keyframes flowerFloat {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-2.5px) rotate(6deg); }
    }
    .flower-float {
      animation: flowerFloat 3s ease-in-out infinite;
    }

    /* ลูกเล่นไทม์ไลน์หน้าคิวทั้งหมด (วงสีน้ำเงิน) */
    @keyframes timelineBeadFlow {
      0% { top: 8%; opacity: 0; }
      18% { opacity: 1; }
      82% { opacity: 1; }
      100% { top: 92%; opacity: 0; }
    }
    .timeline-rail-glow {
      background: linear-gradient(180deg, #F695BA 0%, #F9C4D9 52%, #FADCE8 100%);
      box-shadow: 0 0 8px rgba(238, 121, 163, 0.35);
    }
    .timeline-flow-bead {
      animation: timelineBeadFlow 2.8s ease-in-out infinite;
      box-shadow: 0 0 10px 2px rgba(238, 115, 160, 0.55);
    }

    /* ลูกเล่นมาสคอตและแถบความคืบหน้าในหน้าคิวของฉัน (วงสีฟ้า) */
    @keyframes mascotBreathe {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-4px) rotate(1.2deg); }
    }
    .mascot-float {
      animation: mascotBreathe 3.4s ease-in-out infinite;
    }

    @keyframes mascotTapJump {
      0% { transform: scale(1) translateY(0); }
      35% { transform: scale(1.09) translateY(-8px) rotate(-2.5deg); }
      70% { transform: scale(0.97) translateY(1px) rotate(1.5deg); }
      100% { transform: scale(1) translateY(0); }
    }
    .mascot-jump {
      animation: mascotTapJump 0.48s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes heartFloatPop {
      0% { opacity: 0; transform: translate(-50%, 6px) scale(0.6); }
      25% { opacity: 1; transform: translate(-50%, -8px) scale(1.1); }
      100% { opacity: 0; transform: translate(-50%, -34px) scale(0.95); }
    }
    .heart-pop {
      animation: heartFloatPop 0.9s ease-out forwards;
    }

    @keyframes twinkleSoft {
      0%, 100% { opacity: 0.45; transform: scale(0.85); }
      50% { opacity: 1; transform: scale(1.15); }
    }
    .twinkle-soft {
      animation: twinkleSoft 2.1s ease-in-out infinite;
    }

    @keyframes stepHop {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-3.5px); }
    }
    .step-bunny-bounce {
      animation: stepHop 1.5s ease-in-out infinite;
    }

    @keyframes stepPulseRing {
      0% { box-shadow: 0 0 0 0 rgba(238, 121, 163, 0.45); }
      70% { box-shadow: 0 0 0 8px rgba(238, 121, 163, 0); }
      100% { box-shadow: 0 0 0 0 rgba(238, 121, 163, 0); }
    }
    .step-active-glow {
      animation: stepPulseRing 1.9s ease-out infinite;
    }

    /* แถบคลื่นเสียงดุ๊กดิ๊กสำหรับปุ่มเสียงเพลง */
    @keyframes eqDance {
      0%, 100% { height: 4px; }
      50% { height: 12px; }
    }
    .eq-bar-1 { animation: eqDance 0.65s ease-in-out infinite; }
    .eq-bar-2 { animation: eqDance 0.52s ease-in-out 0.15s infinite; }
    .eq-bar-3 { animation: eqDance 0.72s ease-in-out 0.3s infinite; }

    /* แอนิเมชันเข้าหน้าและหน้าต่างป๊อปอัป */
    @keyframes pageFadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .page-enter {
      animation: pageFadeIn 0.24s ease-out;
    }

    @keyframes sheetSlideUp {
      from { opacity: 0; transform: translateY(18px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .sheet-enter {
      animation: sheetSlideUp 0.24s ease-out;
    }

    /* หน้าโหลดเข้าเว็บธีมชมพูนมน่ารัก */
    .splash-backdrop {
      background: radial-gradient(circle at 50% 25%, #FFFFFF 0%, #FFF2F7 48%, #FCE3EE 100%);
      transition: opacity 0.42s ease, visibility 0.42s ease;
    }
    .splash-hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    /* ลูกเล่นแสงฟุ้ง ๆ ออกจากโลโก้ในหน้าดาวน์โหลด */
    @keyframes logoMistAuraPulse {
      0%, 100% {
        opacity: 0.65;
        transform: scale(0.92);
      }
      50% {
        opacity: 0.96;
        transform: scale(1.12);
      }
    }
    @keyframes logoMistRingOut {
      0% {
        opacity: 0.72;
        transform: scale(0.62);
      }
      70% {
        opacity: 0.25;
      }
      100% {
        opacity: 0;
        transform: scale(1.68);
      }
    }
    @keyframes logoMistFloatOut {
      0% {
        opacity: 0;
        transform: translate(-50%, -50%) translate(0px, 0px) scale(0.45);
      }
      24% {
        opacity: 0.9;
      }
      80% {
        opacity: 0.45;
      }
      100% {
        opacity: 0;
        transform: translate(-50%, -50%) translate(var(--mx, 0px), var(--my, -48px)) scale(1.18);
      }
    }
    .logo-mist-aura {
      background: radial-gradient(circle, rgba(255, 255, 255, 0.96) 0%, rgba(255, 206, 228, 0.78) 42%, rgba(247, 166, 202, 0.24) 72%, rgba(255, 236, 245, 0) 100%);
      filter: blur(12px);
      animation: logoMistAuraPulse 2.8s ease-in-out infinite;
    }
    .logo-mist-ring {
      border: 1.5px solid rgba(246, 164, 201, 0.58);
      box-shadow: 0 0 18px rgba(255, 192, 221, 0.55);
      filter: blur(1.2px);
      animation: logoMistRingOut 2.8s cubic-bezier(0.22, 1, 0.36, 1) infinite;
    }
    .logo-mist-orb {
      border-radius: 9999px;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.98) 0%, rgba(255, 186, 217, 0.82) 55%, rgba(255, 186, 217, 0) 100%);
      filter: blur(1.8px);
      animation: logoMistFloatOut 2.9s ease-out infinite;
    }
    .logo-mist-spark {
      filter: drop-shadow(0 0 6px rgba(244, 150, 192, 0.72));
      animation: logoMistFloatOut 3.1s ease-out infinite;
    }

    /* ลูกเล่นรูปตัวคิว (ไม่มีกรอบ พื้นโปร่งใส ลอยเด้งนุ่ม ๆ พร้อมแสงฟุ้งและประกายวิ้ง) */
    @keyframes queueAvatarFloat {
      0%, 100% {
        transform: translateY(0px) rotate(0deg);
      }
      50% {
        transform: translateY(-2.5px) rotate(2.2deg);
      }
    }
    @keyframes queueAvatarGlow {
      0%, 100% {
        opacity: 0.38;
        transform: scale(0.9);
      }
      50% {
        opacity: 0.76;
        transform: scale(1.12);
      }
    }
    .queue-avatar-charm {
      animation: queueAvatarFloat 2.8s ease-in-out infinite;
      filter: drop-shadow(0 3px 6px rgba(232, 120, 164, 0.24));
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.2s ease;
    }
    .queue-avatar-charm:hover,
    .group:hover .queue-avatar-charm {
      filter: drop-shadow(0 4px 10px rgba(236, 114, 162, 0.42));
    }
    .queue-avatar-aura {
      background: radial-gradient(circle, rgba(255, 200, 224, 0.68) 0%, rgba(255, 220, 236, 0) 72%);
      filter: blur(4px);
      animation: queueAvatarGlow 2.6s ease-in-out infinite;
    }

    /* ลูกเล่นแสงฟุ้งนุ่ม ๆ เวลาแตะหน้าจอ (ไม่ใช้อิโมจิ) */
    @keyframes tapMistBloom {
      0% {
        opacity: 0.78;
        transform: translate(-50%, -50%) scale(0.28);
      }
      50% {
        opacity: 0.48;
      }
      100% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(1.65);
      }
    }
    @keyframes tapMistRing {
      0% {
        opacity: 0.72;
        transform: translate(-50%, -50%) scale(0.35);
      }
      100% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(1.9);
      }
    }
    @keyframes tapOrbDrift {
      0% {
        opacity: 0.9;
        transform: translate(-50%, -50%) translate(0px, 0px) scale(0.5);
      }
      45% {
        opacity: 0.85;
      }
      100% {
        opacity: 0;
        transform: translate(-50%, -50%) translate(var(--dx, 0px), var(--dy, -26px)) scale(1.15);
      }
    }
    .tap-mist-aura {
      position: fixed;
      width: 84px;
      height: 84px;
      border-radius: 9999px;
      pointer-events: none;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.92) 0%, rgba(255, 198, 224, 0.72) 38%, rgba(246, 152, 194, 0.28) 68%, rgba(255, 232, 243, 0) 100%);
      filter: blur(7px);
      animation: tapMistBloom 0.76s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }
    .tap-mist-ring {
      position: fixed;
      width: 52px;
      height: 52px;
      border-radius: 9999px;
      pointer-events: none;
      border: 1.5px solid rgba(245, 160, 198, 0.65);
      box-shadow: 0 0 14px rgba(255, 184, 216, 0.55);
      filter: blur(0.8px);
      animation: tapMistRing 0.68s ease-out forwards;
    }
    .tap-mist-orb {
      position: fixed;
      border-radius: 9999px;
      pointer-events: none;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.96) 0%, rgba(255, 186, 217, 0.78) 60%, rgba(255, 186, 217, 0) 100%);
      filter: blur(1.4px);
      animation: tapOrbDrift 0.78s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    .tap-mist-spark {
      position: fixed;
      pointer-events: none;
      filter: drop-shadow(0 0 5px rgba(245, 148, 190, 0.75));
      animation: tapOrbDrift 0.82s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
  </style>
</head>
<body class="min-h-[100dvh] flex items-center justify-center sm:p-5">

  <!-- โครงสร้างหลักของแอป: เต็มจอบนมือถือ และจัดกึ่งกลางในกรอบขอบมนบน iPad/คอมพิวเตอร์ -->
  <div id="app-shell"
       class="relative z-10 w-full min-h-[100dvh] sm:min-h-[740px] sm:h-[88dvh] sm:max-h-[840px] sm:max-w-[404px] app-canvas flex flex-col sm:rounded-[2.4rem] sm:border-[5px] sm:border-white sm:shadow-[0_22px_52px_-16px_rgba(196,120,150,0.30)] overflow-hidden">

    <!-- หน้าโหลดเข้าเว็บน่ารัก ๆ เข้าธีม (แสดงตอนเปิดเว็บหรือกดดูซ้ำได้) -->
    <div id="cute-splash-loader"
         aria-label="กำลังโหลดหน้าเว็บ"
         class="splash-backdrop fixed sm:absolute inset-0 z-50 flex flex-col items-center justify-center px-7 text-center select-none cursor-pointer">
      <div class="relative w-full max-w-[276px] flex flex-col items-center">

      }

      // แปลงข้อความ Error จาก Supabase เป็นภาษาไทยที่เข้าใจง่าย
      function translateSupabaseError(err, fallbackMsg = 'เกิดข้อผิดพลาดในการเชื่อมต่อฐานข้อมูล กรุณาลองใหม่อีกครั้งนะคะ') {
        if (!err) return fallbackMsg;
        const code = String(err.code || '');
        const msg = String(err.message || err.error_description || '').toLowerCase();

        if (msg.includes('failed to fetch') || msg.includes('network') || msg.includes('load failed')) {
          return 'เชื่อมต่อฐานข้อมูลไม่สำเร็จ กรุณาตรวจสอบอินเทอร์เน็ตแล้วลองใหม่อีกครั้งนะคะ';
        }
        if (msg.includes('invalid login credentials')) {
          return 'อีเมลหรือรหัสผ่านไม่ถูกต้อง กรุณาตรวจสอบและลองใหม่อีกครั้งนะคะ';
        }
        if (msg.includes('email not confirmed')) {
          return 'บัญชีนี้ยังไม่ได้ยืนยันอีเมลใน Supabase Authentication ค่ะ';
        }
        if (code === '23505' || msg.includes('duplicate key')) {
          return 'ข้อมูลหรือรหัสคิวนี้มีอยู่ในระบบแล้ว กรุณาใช้รหัสอื่นนะคะ';
        }
        if (code === '42501' || msg.includes('row-level security') || msg.includes('permission denied')) {
          return 'ไม่มีสิทธิ์ทำรายการนี้ กรุณาเข้าสู่ระบบด้วยบัญชีแอดมินก่อนนะคะ';
        }
        if (code === '23503') {
          return 'ไม่สามารถลบรายการนี้ได้ เนื่องจากยังมีคิวใช้งานอยู่ค่ะ';
        }
        return err.message ? `${fallbackMsg} (${err.message})` : fallbackMsg;
      }

      // แปลงเวลา timestamptz จาก Supabase เป็นข้อความเวลาภาษาไทย
      function formatThaiUpdatedAt(isoString) {
        if (!isoString) return 'วันนี้';
        try {
          const date = new Date(isoString);
          if (Number.isNaN(date.getTime())) return 'วันนี้';
          const now = new Date();
          const sameDay =
            date.getFullYear() === now.getFullYear() &&
            date.getMonth() === now.getMonth() &&
            date.getDate() === now.getDate();
          const hh = String(date.getHours()).padStart(2, '0');
          const mm = String(date.getMinutes()).padStart(2, '0');
          if (sameDay) {
            return `${hh}:${mm} น.`;
          }
          const months = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];
          return `${date.getDate()} ${months[date.getMonth()]} ${hh}:${mm} น.`;
        } catch (err) {
          return 'วันนี้';
        }
      }

      // แปลงแถวข้อมูลจากตาราง queue_app_queues เป็นอ็อบเจกต์ที่หน้าเว็บใช้งาน
      function mapQueueRowFromDb(row) {
        return {
          id: row.id,
          code: String(row.code || '').trim(),
          status: row.status_id || 'waiting',
          sortOrder: typeof row.sort_order === 'number' ? row.sort_order : 0,
          avatarPreset: row.avatar_preset || 'auto',
          avatarUrl: row.avatar_url || '',
          customerName: row.customer_name || '',
          service: row.service || 'งานตกแต่งคิวมาตรฐาน',
          dueDate: row.due_date || 'ตามลำดับคิว',
          workStep: row.work_step || 'รับคิวและบันทึกบรีฟเรียบร้อย',
          details: row.details || '',
          progressPercent: typeof row.progress_percent === 'number' ? row.progress_percent : null,
          note: row.note || '',
          createdAt: row.created_at || '',
          updatedAtIso: row.updated_at || '',
          updatedAt: formatThaiUpdatedAt(row.updated_at || row.created_at),
        };
      }

      // ข้อมูลหลักของเว็บแอป (อ่านจาก Supabase จริง ไม่มีข้อมูลคิว Demo)
      let appData = cloneData(DEFAULT_CONFIG);

      // สถานะการล็อกอินและสิทธิ์แอดมิน (ตรวจสอบจาก auth.users + queue_app_admins)
      const authState = {
        checking: true,
        user: null,
        isAdmin: false,
        loginError: '',
      };

      const uiState = {
        activeView: 'check',           // 'check' | 'my-queue' | 'all' | 'contact'
        selectedQueueCode: null,       // รหัสคิวที่กำลังเปิดดูในหน้า "คิวของฉัน"
        searchInputValue: '',          // ค่าช่องค้นหา (เริ่มว่างตอนเปิดหน้า)
        searchError: '',               // ข้อความแจ้งเตือนเมื่อไม่พบรหัส
        allQueueFilter: 'all',         // ตัวกรองหน้าคิวทั้งหมด: 'all' | 'waiting' | 'done'
        showAdminModal: false,         // สวิตช์เปิด-ปิดหน้าต่างระบบหลังบ้านจากไอคอนฟันเฟือง
        adminTab: 'queues',            // แท็บหลังบ้าน: 'queues' | 'add' | 'settings'
        editingQueueCode: null,        // รหัสคิวที่กำลังเปิดฟอร์มแก้ไขความคืบหน้า
        sharingQueueCode: null,        // รหัสคิวที่กำลังเปิดหน้าต่างคัดลอกลิงก์และฟอร์มข้อความ
        confirmDeleteCode: null,       // ยืนยันการลบคิวแบบกด 2 ครั้ง (แทน confirm)
        showInlineTemplateEdit: false, // เปิดกล่องแก้เทมเพลตฟอร์มหลักในหน้าคัดลอกลิงก์
        showStatusManager: false,      // เปิดกล่องเพิ่ม/ลบสถานะคิวในแท็บ "+ เพิ่มคิว"
        downloadModalCode: null,       // รหัสคิวที่กำลังเปิดหน้าต่างดาวน์โหลดบัตรคิว
        musicPlaying: false,           // สถานะเปิด/ปิดเสียงเพลงกล่องดนตรี
        isLoadingData: true,           // กำลังโหลดข้อมูลจาก Supabase
        hasLoadedOnce: false,          // โหลดข้อมูลครั้งแรกเสร็จแล้วหรือยัง
        loadError: '',                 // ข้อความ Error หากโหลดข้อมูลจาก Supabase ไม่สำเร็จ
        isSaving: false,               // ล็อกปุ่มป้องกันการกดบันทึกหรือส่งข้อมูลซ้ำ
      };

      let lastSyncTimestamp = 0;

      /**
       * โหลดข้อมูลจริงทั้งหมดจาก Supabase (queue_app_settings, queue_app_statuses, queue_app_queues)
       */
      async function fetchAllFromSupabase({ silent = false } = {}) {
        if (!supabaseClient) {
          uiState.isLoadingData = false;
          uiState.loadError = 'ไม่สามารถโหลดไลบรารี Supabase ได้ กรุณารีเฟรชหน้าเว็บหรือตรวจสอบอินเทอร์เน็ตนะคะ';
          renderApp();
          return false;
        }

        if (!silent) {
          uiState.isLoadingData = true;
          uiState.loadError = '';
          renderApp();
        }

        try {
          const [settingsRes, statusesRes, queuesRes] = await Promise.all([
            supabaseClient.from('queue_app_settings').select('*').eq('id', 1).maybeSingle(),
            supabaseClient
              .from('queue_app_statuses')
              .select('*')
              .order('sort_order', { ascending: true })
              .order('created_at', { ascending: true }),
            supabaseClient
              .from('queue_app_queues')
              .select('*')
              .order('sort_order', { ascending: true })
              .order('created_at', { ascending: true }),
          ]);

          if (settingsRes.error) throw settingsRes.error;
          if (statusesRes.error) throw statusesRes.error;
          if (queuesRes.error) throw queuesRes.error;

          // 1) ค่าตั้งร้าน + ช่องทางติดต่อ + ฟอร์มคัดลอกลิงก์
          const settingsRow = settingsRes.data;
          if (settingsRow) {
            const dbChannels = Array.isArray(settingsRow.contact_channels) ? settingsRow.contact_channels : [];
            const dbChMap = new Map(dbChannels.map((c) => [c.id, c]));
            const mergedChannels = DEFAULT_CONFIG.contactChannels.map((defCh) => {
              const found = dbChMap.get(defCh.id);
              return found ? { ...defCh, ...found, url: typeof found.url === 'string' ? found.url : '' } : { ...defCh };
            });

            appData.shopName = settingsRow.shop_name || DEFAULT_CONFIG.shopName;
            appData.shopSubtitle = settingsRow.shop_subtitle || DEFAULT_CONFIG.shopSubtitle;
            appData.bannerImageUrl = settingsRow.banner_image_url || DEFAULT_CONFIG.bannerImageUrl;
            appData.mascotImageUrl = settingsRow.mascot_image_url || DEFAULT_CONFIG.mascotImageUrl;
            appData.shareTemplate = settingsRow.share_template || DEFAULT_CONFIG.shareTemplate;
            appData.contactChannels = mergedChannels;
          }

          // 2) รายการสถานะคิว
          const statusRows = Array.isArray(statusesRes.data) ? statusesRes.data : [];
          if (statusRows.length > 0) {
            appData.statusOptions = statusRows.map((st) => ({
              id: st.id,
              label: st.label,
              category: st.category || 'waiting',
              color: st.color || 'pink',
              sortOrder: typeof st.sort_order === 'number' ? st.sort_order : 0,
            }));
          }

          // 3) รายการคิวจริงทั้งหมดจาก Supabase
          const queueRows = Array.isArray(queuesRes.data) ? queuesRes.data : [];
          appData.queues = queueRows.map(mapQueueRowFromDb);

          // อัปเดตชื่อร้านและมาสคอตในหน้าโหลดเข้าเว็บให้ตรงกับฐานข้อมูล
          const splashShopEl = document.getElementById('splash-shop-name');
          const splashMascotEl = document.getElementById('splash-mascot-img');
          if (splashShopEl) splashShopEl.textContent = appData.shopName;
          if (splashMascotEl && appData.mascotImageUrl) splashMascotEl.src = appData.mascotImageUrl;

          uiState.isLoadingData = false;
          uiState.hasLoadedOnce = true;
          uiState.loadError = '';
          lastSyncTimestamp = Date.now();
          renderApp();
          if (uiState.showAdminModal) renderAdminModal();
          return true;
        } catch (err) {
          console.error('Supabase fetch error:', err);
          uiState.isLoadingData = false;
          uiState.loadError = translateSupabaseError(err, 'ไม่สามารถโหลดข้อมูลคิวจาก Supabase ได้');
          renderApp();
          if (uiState.showAdminModal) renderAdminModal();
          return false;
        }
      }

      /**
       * ตรวจสอบสถานะล็อกอินและตรวจสิทธิ์ในตาราง queue_app_admins
       */
      async function syncAdminSession(existingSession = undefined) {
        if (!supabaseClient) {
          authState.checking = false;
          authState.user = null;
          authState.isAdmin = false;
          return;
        }

        authState.checking = true;
        try {
          let session = existingSession;
          if (session === undefined) {
            const { data, error } = await supabaseClient.auth.getSession();
            if (error) throw error;
            session = data ? data.session : null;
          }

          if (!session || !session.user) {
            authState.user = null;
            authState.isAdmin = false;
            authState.checking = false;
            if (uiState.showAdminModal) renderAdminModal();
            return;
          }

          authState.user = session.user;

          // ตรวจว่า UID นี้มีรายชื่ออยู่ในตาราง queue_app_admins จริงหรือไม่
          const { data: adminRow, error: adminErr } = await supabaseClient
            .from('queue_app_admins')
            .select('user_id, role')
            .eq('user_id', session.user.id)
            .maybeSingle();

          if (adminErr) {
            console.warn('ตรวจสิทธิ์แอดมินไม่สำเร็จ:', adminErr);
            authState.isAdmin = false;
          } else {
            authState.isAdmin = Boolean(adminRow && adminRow.user_id === session.user.id);
          }
        } catch (err) {
          console.warn('Session check error:', err);
          authState.user = null;
          authState.isAdmin = false;
        } finally {
          authState.checking = false;
          if (uiState.showAdminModal) renderAdminModal();
        }
      }

      /**
       * ตัวช่วยรันคำสั่งบันทึก/แก้ไข/ลบ พร้อมป้องกันการกดซ้ำและแจ้งสถานะชัดเจน
       */
      async function runAdminMutation(fn) {
        if (uiState.isSaving) {
          showToast('กำลังบันทึกข้อมูลอยู่ กรุณารอสักครู่นะคะ');
          return;
        }
        if (!supabaseClient || !authState.isAdmin) {
          showToast('กรุณาเข้าสู่ระบบแอดมินก่อนทำรายการนะคะ');
          renderAdminModal();
          return;
        }
        uiState.isSaving = true;
        renderAdminModal();
        try {
          await fn();
        } catch (err) {
          console.error('Admin mutation error:', err);
          showToast(translateSupabaseError(err, 'บันทึกข้อมูลไม่สำเร็จ'));
        } finally {
          uiState.isSaving = false;
          renderApp();
          renderAdminModal();
        }
      }

      /* =======================================================================
         3) ฟังก์ชันช่วยคำนวณคิว สถานะคิว ลิงก์เฉพาะลูกค้า และจัดการข้อความ
         ======================================================================= */
      function escapeHtml(value) {
        return String(value ?? '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      function normalizeQueueCode(raw) {
        return String(raw || '').trim().toUpperCase();
      }

      function getCurrentTimeThai() {
        try {
          const now = new Date();
          const hh = String(now.getHours()).padStart(2, '0');
          const mm = String(now.getMinutes()).padStart(2, '0');
          return `${hh}:${mm} น.`;
        } catch (err) {
          return 'อัปเดตล่าสุดวันนี้';
        }
      }

      function getStatusMeta(statusId) {
        const list =
          Array.isArray(appData.statusOptions) && appData.statusOptions.length
            ? appData.statusOptions
            : DEFAULT_CONFIG.statusOptions;
        const found = list.find((s) => s.id === statusId);
        if (found) {
          const style = STATUS_COLOR_STYLES[found.color] || STATUS_COLOR_STYLES.pink;
          return { ...found, badgeClass: style.badge, hexBg: style.hexBg, hexText: style.hexText };
        }
        const fallbackCategory = statusId === 'doing' ? 'doing' : statusId === 'done' ? 'done' : 'waiting';
        const fallbackColor = fallbackCategory === 'doing' ? 'peach' : fallbackCategory === 'done' ? 'mint' : 'pink';
        const style = STATUS_COLOR_STYLES[fallbackColor];
        return {
          id: statusId || 'waiting',
          label: fallbackCategory === 'doing' ? 'กำลังทำ' : fallbackCategory === 'done' ? 'เสร็จแล้ว' : 'รอคิว',
          category: fallbackCategory,
          color: fallbackColor,
          badgeClass: style.badge,
          hexBg: style.hexBg,
          hexText: style.hexText,
        };
      }

      function getStatusCategory(statusId) {
        return getStatusMeta(statusId).category;
      }

      function getDoingQueue() {
        return appData.queues.find((q) => getStatusCategory(q.status) === 'doing') || null;
      }

      function getWaitingQueues() {
        return appData.queues.filter((q) => getStatusCategory(q.status) === 'waiting');
      }

      function getDoneQueues() {
        return appData.queues.filter((q) => getStatusCategory(q.status) === 'done');
      }

      function findQueueByCode(rawCode) {
        const target = normalizeQueueCode(rawCode);
        if (!target) return null;
        return appData.queues.find((q) => normalizeQueueCode(q.code) === target) || null;
      }

      function generateNextQueueCode() {
        let maxNum = 0;
        let prefix = 'Q-';
        let padLen = 3;
        appData.queues.forEach((q) => {
          const match = String(q.code || '').trim().match(/^([A-Za-zก-๙_-]*?)(\d+)$/);
          if (match) {
            prefix = match[1] || 'Q-';
            padLen = Math.max(padLen, match[2].length);
            const n = parseInt(match[2], 10);
            if (!Number.isNaN(n) && n > maxNum) maxNum = n;
          }
        });
        const nextNum = String(maxNum + 1).padStart(padLen, '0');
        return `${prefix}${nextNum}`;
      }

      function buildQueueDirectLink(code) {
        const cleanCode = encodeURIComponent(normalizeQueueCode(code));
        try {
          if (window.location.href && /^https?:\/\//i.test(window.location.href)) {
            const url = new URL(window.location.href);
            url.searchParams.set('queue', normalizeQueueCode(code));
            url.hash = '';
            return url.toString();
          }
          const base = String(window.location.href || '').split('?')[0].split('#')[0];
          if (base && !base.startsWith('about:')) {
            return `${base}?queue=${cleanCode}`;
          }
        } catch (err) {
          // fallback ด้านล่าง
        }
        return `https://your-shop-queue.example/?queue=${cleanCode}`;
      }

      function formatShareMessage(queue, customTemplate) {
        const tpl =
          typeof customTemplate === 'string' && customTemplate.trim()
            ? customTemplate
            : appData.shareTemplate || DEFAULT_CONFIG.shareTemplate;
        const link = buildQueueDirectLink(queue.code);
        return tpl
          .replace(/\{customer\}/g, queue.customerName || 'ลูกค้า')
          .replace(/\{code\}/g, queue.code || '')
          .replace(/\{service\}/g, queue.service || 'งานตกแต่งคิวมาตรฐาน')
          .replace(/\{dueDate\}/g, queue.dueDate || 'ตามลำดับคิว')
          .replace(/\{step\}/g, queue.workStep || 'รับคิวเรียบร้อยแล้ว')
          .replace(/\{details\}/g, queue.details || '-')
          .replace(/\{link\}/g, link);
      }

      function copyTextToClipboard(text) {
        try {
          const ta = document.createElement('textarea');
          ta.value = String(text || '');
          ta.setAttribute('readonly', '');
          ta.style.position = 'fixed';
          ta.style.top = '-9999px';
          ta.style.left = '-9999px';
          document.body.appendChild(ta);
          ta.select();
          ta.setSelectionRange(0, ta.value.length);
          const ok = document.execCommand('copy');
          document.body.removeChild(ta);
          return ok;
        } catch (err) {
          console.warn('คัดลอกไม่สำเร็จ:', err);
          return false;
        }
      }

      let toastTimer = null;
      function showToast(message) {
        const box = document.getElementById('toast-box');
        const msgEl = document.getElementById('toast-message');
        if (!box || !msgEl) return;
        msgEl.textContent = message;
        box.classList.remove('opacity-0', '-translate-y-2');
        box.classList.add('opacity-100', 'translate-y-0');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => {
          box.classList.remove('opacity-100', 'translate-y-0');
          box.classList.add('opacity-0', '-translate-y-2');
        }, 2300);
      }

      function applyQueueFromUrlIfPresent() {
        try {
          let codeParam = '';
          const params = new URLSearchParams(window.location.search || '');
          codeParam = params.get('queue') || '';
          if (!codeParam && window.location.hash) {
            const hashMatch = window.location.hash.match(/queue=([^&]+)/i);
            if (hashMatch) codeParam = decodeURIComponent(hashMatch[1]);
          }
          if (codeParam) {
            const matched = findQueueByCode(codeParam);
            if (matched) {
              uiState.selectedQueueCode = matched.code;
              uiState.searchInputValue = matched.code;
              uiState.searchError = '';
              uiState.activeView = 'my-queue';
              return true;
            }
          }
        } catch (err) {
          console.warn('อ่านรหัสคิวจากลิงก์ไม่สำเร็จ:', err);
        }
        return false;
      }

      /**
       * คำนวณจำนวนคิวที่รออยู่ก่อนหน้า (ไม่นับคิวกำลังทำ คิวเสร็จแล้ว หรือคิวของลูกค้าเอง)
       */
      function computeMyQueueDetails(queue) {
        const doingQueue = getDoingQueue();
        const waitingQueues = getWaitingQueues();
        const waitingBefore = [];
        const statusCat = getStatusCategory(queue.status);

        if (statusCat === 'waiting') {
          const myIndex = waitingQueues.findIndex(
            (q) => normalizeQueueCode(q.code) === normalizeQueueCode(queue.code)
          );
          if (myIndex > 0) {
            waitingBefore.push(...waitingQueues.slice(0, myIndex));
          }
        }

        const countBefore = waitingBefore.length;

        let progressStep = 2;
        let progressPercent = 45;
        let estimatedWaitText = 'รอสักครู่นะคะ';
        let currentStageLabel = 'กำลังรอคิวตามลำดับ';

        if (statusCat === 'done') {
          progressStep = 4;
          progressPercent = 100;
          estimatedWaitText = 'เสร็จเรียบร้อยแล้ว';
          currentStageLabel = 'ดำเนินการเสร็จสมบูรณ์';
        } else if (statusCat === 'doing') {
          progressStep = 3;
          progressPercent = 78;
          estimatedWaitText = 'กำลังให้บริการอยู่ในขณะนี้';
          currentStageLabel = 'กำลังดำเนินการคิวของคุณ';
        } else if (countBefore === 0) {
          progressStep = 2;
          progressPercent = 62;
          estimatedWaitText = doingQueue ? 'ประมาณ 10 - 15 นาที' : 'พร้อมเรียกคิวทันที';

      /* =======================================================================
         4.1) ระบบปรับขนาดรูปตัวคิวอัตโนมัติ (ตัดขอบโปร่งใสและจัดกึ่งกลางให้เท่าระบบเดิมทุกรูป)
         ======================================================================= */
      const trimmedAvatarCache = new Map();

      // ค่าจัดตำแหน่งสำรองกรณีเบราว์เซอร์บล็อก CORS บนรูปเดิมที่มีขอบโปร่งใสกว้าง
      const FALLBACK_AVATAR_ADJUST = {
        [QUEUE_AVATAR_IMAGES[0]]: 'scale(2.55) translate(23%, -22%)',
        [QUEUE_AVATAR_IMAGES[1]]: 'scale(2.55) translate(-32%, 22%)',
      };

      function applyAvatarVisualState(imgEl, originalUrl) {
        const entry = trimmedAvatarCache.get(originalUrl);
        if (!imgEl || !entry) return;
        if (entry.status === 'ready' && entry.objectUrl) {
          if (imgEl.src !== entry.objectUrl) {
            imgEl.src = entry.objectUrl;
          }
          imgEl.style.transform = '';
          imgEl.style.transformOrigin = '';
          imgEl.classList.remove('opacity-90');
        } else if (entry.status === 'fallback') {
          const fallbackTransform = FALLBACK_AVATAR_ADJUST[originalUrl];
          if (fallbackTransform) {
            imgEl.style.transform = fallbackTransform;
            imgEl.style.transformOrigin = '50% 50%';
          }
        }
      }

      function applyNormalizedAvatarToDom(originalUrl) {
        document.querySelectorAll('img[data-avatar-source-url]').forEach((imgEl) => {
          if (imgEl.getAttribute('data-avatar-source-url') === originalUrl) {
            applyAvatarVisualState(imgEl, originalUrl);
          }
        });
      }

      async function normalizeAvatarImageUrl(url) {
        if (!url || !/^https?:\/\//i.test(url)) return;
        const existing = trimmedAvatarCache.get(url);
        if (existing && (existing.status === 'loading' || existing.status === 'ready' || existing.status === 'fallback')) {
          if (existing.status !== 'loading') {
            applyNormalizedAvatarToDom(url);
          }
          return;
        }

        trimmedAvatarCache.set(url, { status: 'loading' });

        let tempBlobUrl = null;
        try {
          // โหลดภาพแบบ CORS และไม่ใช้แคชเดิม เพื่อป้องกันปัญหา Safari/iPadOS บล็อกแคช non-CORS
          const response = await fetch(url, {
            mode: 'cors',
            credentials: 'omit',
            cache: 'no-store',
          });
          if (!response.ok) throw new Error('Image fetch failed');
          const rawBlob = await response.blob();
          tempBlobUrl = URL.createObjectURL(rawBlob);

          const decodedImg = await new Promise((resolve, reject) => {
            const img = new Image();
            img.onload = () => resolve(img);
            img.onerror = () => reject(new Error('Image decode failed'));
            img.src = tempBlobUrl;
          });

          const natW = decodedImg.naturalWidth || 0;
          const natH = decodedImg.naturalHeight || 0;
          if (!natW || !natH) throw new Error('Invalid image dimensions');

          // ย่อลงไม่เกิน 1024px เพื่อสแกนขอบโปร่งใสได้เร็วและลื่นบนมือถือ/iPad
          const maxScanDim = 1024;
          const downScale = Math.min(1, maxScanDim / Math.max(natW, natH));
          const scanW = Math.max(1, Math.round(natW * downScale));
          const scanH = Math.max(1, Math.round(natH * downScale));

          const scanCanvas = document.createElement('canvas');
          scanCanvas.width = scanW;
          scanCanvas.height = scanH;
          const scanCtx = scanCanvas.getContext('2d', { willReadFrequently: true });
          if (!scanCtx) throw new Error('Canvas context unavailable');

          scanCtx.drawImage(decodedImg, 0, 0, scanW, scanH);
          const pixels = scanCtx.getImageData(0, 0, scanW, scanH).data;

          // หาขอบเขตพิกเซลที่มองเห็นจริง (alpha > 14) เพื่อตัดพื้นที่โปร่งใสรอบข้างออกทั้งหมด
          let minX = scanW;
          let minY = scanH;
          let maxX = -1;
          let maxY = -1;

          for (let y = 0; y < scanH; y += 1) {
            const rowOffset = y * scanW * 4;
            for (let x = 0; x < scanW; x += 1) {
              const alpha = pixels[rowOffset + x * 4 + 3];
              if (alpha > 14) {
                if (x < minX) minX = x;
                if (x > maxX) maxX = x;
                if (y < minY) minY = y;
                if (y > maxY) maxY = y;
              }
            }
          }

          if (maxX < minX || maxY < minY) {
            throw new Error('Empty transparent image');
          }

          const cropW = maxX - minX + 1;
          const cropH = maxY - minY + 1;

          // วาดภาพที่ตัดขอบแล้วลงกรอบสี่เหลี่ยมมาตรฐาน 192x192 (เต็ม 92% และคงสัดส่วนเดิมไม่ยืด)
          const OUT_SIZE = 192;
          const outCanvas = document.createElement('canvas');
          outCanvas.width = OUT_SIZE;
          outCanvas.height = OUT_SIZE;
          const outCtx = outCanvas.getContext('2d');
          if (!outCtx) throw new Error('Output canvas unavailable');

          outCtx.imageSmoothingEnabled = true;
          outCtx.imageSmoothingQuality = 'high';

          const fitScale = (OUT_SIZE * 0.92) / Math.max(cropW, cropH);
          const drawW = cropW * fitScale;
          const drawH = cropH * fitScale;
          const dx = (OUT_SIZE - drawW) / 2;
          const dy = (OUT_SIZE - drawH) / 2;

          outCtx.drawImage(scanCanvas, minX, minY, cropW, cropH, dx, dy, drawW, drawH);

          const normalizedUrl = await new Promise((resolve) => {
            if (typeof outCanvas.toBlob === 'function') {
              outCanvas.toBlob((outBlob) => {
                if (outBlob) {
                  resolve(URL.createObjectURL(outBlob));
                } else {
                  resolve(outCanvas.toDataURL('image/png'));
                }
              }, 'image/png');
            } else {
              resolve(outCanvas.toDataURL('image/png'));
            }
          });

          trimmedAvatarCache.set(url, { status: 'ready', objectUrl: normalizedUrl });
          applyNormalizedAvatarToDom(url);
        } catch (err) {
          trimmedAvatarCache.set(url, { status: 'fallback' });
          applyNormalizedAvatarToDom(url);
        } finally {
          if (tempBlobUrl) {
            URL.revokeObjectURL(tempBlobUrl);
          }
        }
      }

      function hydrateQueueAvatars() {
        document.querySelectorAll('img[data-avatar-source-url]').forEach((imgEl) => {
          const sourceUrl = imgEl.getAttribute('data-avatar-source-url');
          if (!sourceUrl) return;
          const entry = trimmedAvatarCache.get(sourceUrl);
          if (entry && entry.status !== 'loading') {
            applyAvatarVisualState(imgEl, sourceUrl);
          } else {
            normalizeAvatarImageUrl(sourceUrl);
          }
        });
      }

      function renderQueueAvatar(queue, fallbackVariant = 'pink', sizeClass = 'w-10 h-10', altIndex = null) {
        const customUrl = queue && typeof queue.avatarUrl === 'string' ? queue.avatarUrl.trim() : '';
        const preset = queue && queue.avatarPreset ? String(queue.avatarPreset) : 'auto';

        // คำนวณลำดับสำหรับสลับใช้รูปตัวคิว 2 รูปหลักและหน่วงจังหวะแอนิเมชันไม่ให้ขยับพร้อมกัน
        let resolvedIdx = 0;
        if (typeof altIndex === 'number' && !Number.isNaN(altIndex)) {
          resolvedIdx = altIndex;
        } else if (queue && queue.code) {
          const foundIdx = appData.queues.findIndex(
            (item) => normalizeQueueCode(item.code) === normalizeQueueCode(queue.code)
          );
          resolvedIdx = foundIdx >= 0 ? foundIdx : 0;
        }

        const animDelay = `${((Math.abs(resolvedIdx) % 5) * 0.28).toFixed(2)}s`;
        const isShowcaseSize = sizeClass.includes('w-9') || sizeClass.includes('w-10') || sizeClass.includes('w-14');
        const sparkleHtml = isShowcaseSize
          ? `
            <span class="pointer-events-none absolute -top-0.5 -right-0.5 twinkle-soft z-10" style="animation-delay: ${animDelay};" aria-hidden="true">
              <svg width="9" height="9" viewBox="0 0 24 24" fill="none">
                <path d="M12 2L14.4 9.6L22 12L14.4 14.4L12 22L9.6 14.4L2 12L9.6 9.6L12 2Z" fill="${Math.abs(resolvedIdx) % 2 === 0 ? '#FF8EB8' : '#F8B0CD'}"/>
              </svg>
            </span>
          `
          : '';
        const softAuraHtml = isShowcaseSize
          ? `<span class="queue-avatar-aura pointer-events-none absolute inset-0.5 rounded-full" style="animation-delay: ${animDelay};" aria-hidden="true"></span>`
          : '';

        // กรณีผู้ใช้เลือกใช้ไอคอน SVG โดยเฉพาะ
        if (!customUrl && preset.startsWith('svg:')) {
          const svgKey = preset.slice(4) || fallbackVariant;
          return `
            <span class="relative inline-flex items-center justify-center ${sizeClass} shrink-0 bg-transparent">
              ${softAuraHtml}
              <span class="relative z-[1] inline-flex items-center justify-center w-full h-full ${isShowcaseSize ? 'queue-avatar-charm' : ''}" style="animation-delay: ${animDelay};">
                ${getCuteCharacterSvg(svgKey, 'w-full h-full')}
              </span>
              ${sparkleHtml}
            </span>
          `;
        }

        let imageUrl = '';
        if (customUrl && /^https?:\/\//i.test(customUrl)) {
          imageUrl = customUrl;
        } else if (preset === 'cute1') {
          imageUrl = QUEUE_AVATAR_IMAGES[0];
        } else if (preset === 'cute2') {
          imageUrl = QUEUE_AVATAR_IMAGES[1];
        } else {
          imageUrl = QUEUE_AVATAR_IMAGES[Math.abs(resolvedIdx) % QUEUE_AVATAR_IMAGES.length];
        }

        const cached = trimmedAvatarCache.get(imageUrl);
        const initialSrc = cached && cached.status === 'ready' && cached.objectUrl ? cached.objectUrl : imageUrl;
        const fallbackTransformStyle =
          cached && cached.status === 'fallback' && FALLBACK_AVATAR_ADJUST[imageUrl]
            ? `transform: ${FALLBACK_AVATAR_ADJUST[imageUrl]}; transform-origin: 50% 50%;`
            : '';

        const fallbackSvgKey = preset.startsWith('svg:') ? preset.slice(4) : fallbackVariant;
        return `
          <span class="relative inline-flex items-center justify-center ${sizeClass} shrink-0 bg-transparent">
            ${softAuraHtml}
            <span class="relative z-[1] inline-flex items-center justify-center w-full h-full overflow-hidden bg-transparent ${isShowcaseSize ? 'queue-avatar-charm' : ''}" style="animation-delay: ${animDelay};">
              <img
                src="${escapeHtml(initialSrc)}"
                data-avatar-source-url="${escapeHtml(imageUrl)}"
                alt="รูปตัวคิว ${escapeHtml((queue && queue.code) || '')}"
                referrerpolicy="no-referrer"
                style="${fallbackTransformStyle}"
                class="w-full h-full max-w-full max-h-full object-contain bg-transparent"
                onerror="this.style.display='none'; if(this.nextElementSibling) this.nextElementSibling.classList.remove('hidden');"
              />
              <span class="hidden inline-flex items-center justify-center w-full h-full">${getCuteCharacterSvg(fallbackSvgKey, 'w-full h-full')}</span>
            </span>
            ${sparkleHtml}
          </span>
        `;
      }

      function getDoingFlowerSvg(sizeClass = 'w-7 h-7') {
        return `
          <svg class="${sizeClass} shrink-0" viewBox="0 0 40 40" fill="none" aria-hidden="true">
            <circle cx="20" cy="11" r="6.5" fill="#FFABC7"/>
            <circle cx="28.5" cy="17.2" r="6.5" fill="#FFABC7"/>
            <circle cx="25.2" cy="27.2" r="6.5" fill="#FFABC7"/>
            <circle cx="14.8" cy="27.2" r="6.5" fill="#FFABC7"/>
            <circle cx="11.5" cy="17.2" r="6.5" fill="#FFABC7"/>
            <circle cx="20" cy="20" r="6.2" fill="#FFF7FA" stroke="#EE7EA8" stroke-width="1.8"/>
            <circle cx="20" cy="20" r="2.6" fill="#F279A5"/>
          </svg>
        `;
      }

      /**
       * แบนเนอร์ส่วนบนเหมือนกันทุกหน้า (สไตล์รูปที่ 2: ภาพละมุนไล่เฟด + แถบชื่อหน้ากระจกฝ้า ไม่มีโบว์สีแดง)
       */
      function renderUnifiedBanner({ title, iconSvg, showBackBtn = false }) {
        return `
          <header class="relative w-full h-[142px] overflow-hidden select-none">
            <img
              src="${escapeHtml(appData.bannerImageUrl)}"
              alt="แบนเนอร์ ${escapeHtml(title)}"
              referrerpolicy="no-referrer"
              class="w-full h-full object-cover object-[center_24%] scale-[1.04]"
              onerror="this.style.display='none';"
            />
            <div class="banner-fade-bottom absolute inset-0"></div>

            ${
              showBackBtn
                ? `
                  <button
                    type="button"
                    id="back-to-search-btn"
                    aria-label="กลับไปหน้าค้นหาคิว"
                    class="banner-glass-pill absolute left-3.5 top-3.5 z-20 w-9 h-9 rounded-full flex items-center justify-center text-cocoa hover:bg-white active:scale-95 transition-all cursor-pointer">
                    <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                      <path d="M15 18l-6-6 6-6"></path>
                    </svg>
                  </button>
                `
                : ''
            }

            <!-- แถบชื่อหน้าแบบกระจกฝ้ากึ่งกลางด้านล่างแบนเนอร์ -->
            <div class="absolute inset-x-0 bottom-2.5 z-10 flex justify-center px-4">
              <div class="banner-glass-pill inline-flex items-center gap-2 px-5 py-1.5 rounded-full">
                ${iconSvg || ''}
                <h1 class="font-cute font-bold text-[17px] text-[#B84873] tracking-wide leading-tight">
                  ${escapeHtml(title)}
                </h1>
              </div>
            </div>
          </header>
        `;
      }

      /**
       * ภาพมาสคอต PNG แยกพื้นหลังสำหรับหน้าคิวของฉัน
       */
      function renderMascotImage({ wrapperClass = 'w-full h-[132px]', imgClass = '' } = {}) {
        return `
          <div class="relative flex items-center justify-center ${wrapperClass}">
            <img
              src="${escapeHtml(appData.mascotImageUrl)}"
              alt="มาสคอตน้องสาวและน้องกระต่าย"
              referrerpolicy="no-referrer"
              class="w-full h-full object-contain mascot-png-shadow ${imgClass}"
              onerror="this.style.display='none'; if(this.nextElementSibling) this.nextElementSibling.classList.remove('hidden');"
            />
            <div class="hidden items-center justify-center">
              ${getBunnySvg('pink', 'w-20 h-20')}
            </div>
          </div>
        `;
      }

      /* =======================================================================
         5) ฟังก์ชันเรนเดอร์ทั้ง 4 หน้า + ระบบหลังบ้าน
         ======================================================================= */

      /**
       * หน้า 1: หน้าเช็กคิว ("เช็กคิวของฉัน")
       */
      function renderCheckPage() {
        const doingQueue = getDoingQueue();
        const waitingQueues = getWaitingQueues();
        const hasInput = uiState.searchInputValue.length > 0;
        const firstRealQueue = appData.queues.length > 0 ? appData.queues[0] : null;
        const suggestedSampleCode = firstRealQueue ? firstRealQueue.code : '';
        const inputPlaceholder = suggestedSampleCode ? `เช่น ${suggestedSampleCode}` : 'เช่น Q-001';
        const dbBannerHtml = renderDatabaseStatusBanner();

        const searchBannerIcon = `
          <svg class="w-4 h-4 text-[#DF6E97] shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="11" cy="11" r="7"></circle>
            <path d="M20 20L16.2 16.2"></path>
          </svg>
        `;

        // การ์ด "กำลังทำ" ฉบับกะทัดรัดเล็กลงตามวงสีเหลือง
        const compactDoingCardHtml = doingQueue
          ? `
            <button
              type="button"
              data-open-queue="${escapeHtml(doingQueue.code)}"
              class="doing-pink-card w-full relative overflow-hidden rounded-[1.35rem] px-3.5 py-2.5 text-left active:scale-[0.99] transition-all cursor-pointer space-y-2">
              <div class="flex items-center justify-between gap-2.5">
                <div class="flex items-center gap-2 min-w-0">
                  <div class="flower-float w-8 h-8 rounded-xl bg-white/85 border border-white flex items-center justify-center shadow-xs shrink-0">
                    ${getDoingFlowerSvg('w-6 h-6')}
                  </div>
                  <div class="min-w-0">
                    <div class="flex items-center gap-1.5">
                      <span class="relative flex h-1.5 w-1.5 shrink-0">
                        <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-[#E95B8E] opacity-75"></span>
                        <span class="relative inline-flex rounded-full h-1.5 w-1.5 bg-[#E95B8E]"></span>
                      </span>
                      <span class="font-cute font-bold text-[14px] text-cocoa leading-none">กำลังทำ</span>
                      <span class="text-[10px] font-cute text-[#B65479]">• รออีก ${waitingQueues.length} คิว</span>
                    </div>
                    <div class="text-[11px] text-[#A25372] truncate mt-0.5">
                      ${escapeHtml(doingQueue.workStep || 'กำลังดูแลคิวนี้อยู่นะคะ')}
                    </div>
                  </div>
                </div>

                <span class="shrink-0 bg-white border border-[#F5CBD9] text-cocoa font-cute font-bold text-[16px] px-3 py-1 rounded-full shadow-xs">
                  ${escapeHtml(doingQueue.code)}
                </span>
              </div>

              <!-- แถบความคืบหน้าบาง ๆ มีแสงวิ่ง -->
              <div class="relative h-1.5 w-full rounded-full bg-white/75 overflow-hidden shimmer-bar">
                <div class="h-full rounded-full bg-gradient-to-r from-[#FBA4C3] to-[#EE73A0]" style="width: ${typeof doingQueue.progressPercent === 'number' ? doingQueue.progressPercent : 76}%"></div>
              </div>
            </button>
          `
          : `
            <div class="doing-pink-card rounded-[1.3rem] px-3.5 py-2.5 flex items-center justify-between gap-2">
              <div class="flex items-center gap-2">
                <div class="flower-float">${getDoingFlowerSvg('w-6 h-6')}</div>
                <span class="font-cute font-semibold text-xs text-cocoa">ตอนนี้ยังไม่มีคิวที่กำลังทำ</span>
              </div>
              <span class="text-[11px] font-cute text-[#B65479]">รอ ${waitingQueues.length} คิว</span>
            </div>
          `;

        // รายการข้อความแชทคิวต่อด้านล่าง โดยสลับฝั่งซ้าย-ขวาไปมาแบบแชทจริง
        const bunnyCycle = ['lavender', 'yellow', 'blue', 'pink'];
        const liveChatSteps = [];
        if (doingQueue) {
          liveChatSteps.push({
            prefix: 'ตอนนี้กำลังทำ',
            queue: doingQueue,
            code: doingQueue.code,
            subNote: doingQueue.workStep || '',
            fallbackVariant: 'pink',
            badgeType: 'doing',
          });
        } else {
          liveChatSteps.push({
            prefix: 'ตอนนี้ยังไม่มีคิวที่กำลังทำ',
            queue: null,
            code: '',
            subNote: '',
            fallbackVariant: 'pink',
            badgeType: 'empty',
          });
        }

        waitingQueues.slice(0, 4).forEach((wq, idx) => {
          liveChatSteps.push({
            prefix: idx === 0 ? 'ถัดไป' : 'ตามด้วย',
            queue: wq,
            code: wq.code,
            subNote: wq.dueDate ? `ส่ง ${wq.dueDate}` : '',
            fallbackVariant: bunnyCycle[idx % bunnyCycle.length],
            badgeType: 'waiting',
          });
        });

        const alternatingChatFeedHtml = `
          <div class="clean-card rounded-[1.5rem] p-3.5 space-y-2.5">
            <div class="flex items-center justify-between px-1 pb-1.5 border-b border-[#F8E6EE]">
              <div class="inline-flex items-center gap-1.5 text-[11px] font-cute font-semibold text-[#C84977]">
                <span class="text-[#F08CB0]">♡</span>
                <span>แชทลำดับคิวตอนนี้</span>
              </div>
              <span class="text-[10px] font-cute text-cocoa-soft">แตะคิวเพื่อดูรายละเอียด</span>
            </div>

            <div class="space-y-2.5 pt-0.5" aria-label="แชทคิวปัจจุบันและคิวถัดไปสลับฝั่ง">
              ${liveChatSteps
                .map((step, idx) => {
                  const isRight = idx % 2 === 1;
                  const isDoing = step.badgeType === 'doing';
                  const pillColors = isDoing
                    ? 'bg-[#FCE4EC] text-[#C84A76] border border-[#F4C6D6]'
                    : isRight
                    ? 'bg-white text-cocoa border border-[#F4CFE0]'
                    : 'bg-[#FFF0F5] text-cocoa border border-[#F4D6E1]';
                  const clickableAttr = step.code ? `data-open-queue="${escapeHtml(step.code)}"` : '';
                  const tag = step.code ? 'button' : 'div';
                  const typeAttr = step.code ? 'type="button"' : '';
                  const avatarHtml = renderQueueAvatar(step.queue, step.fallbackVariant, 'w-9 h-9', idx);
                  const bubbleClass = isRight ? 'chat-pill-right text-right' : 'chat-pill text-left';

                  const bubbleInnerHtml = `
                    <${tag} ${typeAttr} ${clickableAttr}
                      class="${bubbleClass} rounded-2xl px-3 py-2 inline-flex flex-col ${isRight ? 'items-end' : 'items-start'} max-w-[78%] ${
                        step.code ? 'hover:border-[#EE9FC0] active:scale-[0.98] transition-all cursor-pointer' : ''
                      }">
                      <div class="flex items-center flex-wrap gap-1.5 ${isRight ? 'justify-end' : 'justify-start'}">
                        <span class="font-cute font-medium text-[13px] text-cocoa">
                          ${escapeHtml(step.prefix)}
                        </span>
                        ${
                          step.code
                            ? `<span class="inline-block font-cute font-semibold text-[13px] px-2.5 py-0.5 rounded-full ${pillColors}">${escapeHtml(step.code)}</span>`
                            : ''
                        }
                      </div>
                      ${
                        step.subNote
                          ? `<span class="text-[10px] text-cocoa-light leading-snug mt-0.5">${escapeHtml(step.subNote)}</span>`
                          : ''
                      }
                    </${tag}>
                  `;

                  return isRight
                    ? `
                      <div class="flex items-center justify-end gap-2">
                        ${bubbleInnerHtml}
                        ${avatarHtml}
                      </div>
                    `
                    : `
                      <div class="flex items-center justify-start gap-2">
                        ${avatarHtml}
                        ${bubbleInnerHtml}
                      </div>
                    `;
                })
                .join('')}
            </div>

            ${
              waitingQueues.length > 4
                ? `
                  <div class="text-center pt-1">
                    <span class="text-[11px] font-cute text-cocoa-light">และอีก ${waitingQueues.length - 4} คิวในหน้า “คิวทั้งหมด”</span>
                  </div>
                `
                : ''
            }
          </div>
        `;

        return `
          <section class="page-enter">
            ${renderUnifiedBanner({ title: 'เช็กคิวของฉัน', iconSvg: searchBannerIcon })}

            <div class="px-4 pt-2 space-y-3">
              ${dbBannerHtml}

              <form id="queue-search-form" novalidate class="clean-card rounded-[1.7rem] p-4 sm:p-5">
                <label for="queue-code-input" class="block font-cute font-semibold text-[15px] text-cocoa mb-2 pl-0.5">
                  กรอกรหัสคิว
                </label>

                <div class="relative flex items-center">
                  <span class="absolute left-3.5 text-cocoa-soft pointer-events-none" aria-hidden="true">
                    <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
                      <circle cx="11" cy="11" r="7"></circle>
                      <path d="M20 20L16.2 16.2"></path>
                    </svg>
                  </span>

                  <input
                    id="queue-code-input"
                    type="text"
                    inputmode="text"
                    autocomplete="off"
                    autocapitalize="characters"
                    spellcheck="false"
                    value="${escapeHtml(uiState.searchInputValue)}"
                    placeholder="${escapeHtml(inputPlaceholder)}"
                    aria-describedby="search-hint search-error"
                    class="clean-input w-full pl-10 pr-10 py-3 rounded-2xl ${uiState.searchError ? '!border-[#E0537F] !bg-[#FFF5F8]' : ''} focus:outline-none font-cute font-semibold text-cocoa placeholder:font-normal placeholder:text-[#CBB0B5]"
                  />

                  <button
                    type="button"
                    id="clear-search-btn"
                    aria-label="ล้างรหัสคิว"
                    class="${hasInput ? 'flex' : 'hidden'} absolute right-3 w-6 h-6 rounded-full bg-[#E7D4DA] hover:bg-[#DBBFC8] text-white items-center justify-center transition-colors">
                    <svg class="w-3 h-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round">
                      <path d="M18 6L6 18M6 6l12 12"></path>
                    </svg>
                  </button>
                </div>

                <div id="search-hint" class="mt-2.5 flex justify-center">
                  ${
                    suggestedSampleCode
                      ? `
                        <div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-[#FFF7FA] border border-[#F8E2EC] text-xs text-cocoa-light">
                          <span class="text-[#F09BB9]">♡</span>
                          <span>ลองค้นหาด้วยรหัส</span>
                          <button type="button" id="try-sample-code" data-sample-code="${escapeHtml(suggestedSampleCode)}" class="font-cute font-semibold text-[#DE628E] underline decoration-dotted underline-offset-2 hover:text-[#B93D66] cursor-pointer">${escapeHtml(suggestedSampleCode)}</button>
                          <span class="text-[#F09BB9]">♡</span>
                        </div>
                      `
                      : `
                        <div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-[#FFF7FA] border border-[#F8E2EC] text-xs text-cocoa-light">
                          <span class="text-[#F09BB9]">♡</span>
                          <span>${uiState.isLoadingData ? 'กำลังโหลดรายการคิว...' : 'ยังไม่มีคิวในระบบขณะนี้ค่ะ'}</span>
                          <span class="text-[#F09BB9]">♡</span>
                        </div>
                      `
                  }
                </div>

                <div id="search-error" role="alert" class="${uiState.searchError ? 'block' : 'hidden'} mt-2.5 rounded-xl bg-[#FFF0F5] border border-[#F3C2D3] px-3.5 py-2 text-xs text-[#C23B67] font-medium">
                  ${escapeHtml(uiState.searchError)}
                </div>

                <button
                  type="submit"
                  class="btn-rose-solid mt-4 w-full py-3.5 px-5 rounded-full font-cute font-semibold text-[16px] flex items-center justify-center gap-2 cursor-pointer">
                  <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="7"></circle>
                    <path d="M20 20L16.2 16.2"></path>
                  </svg>
                  <span>ค้นหาคิว</span>
                </button>
              </form>

              <!-- การ์ดกำลังทำขนาดกะทัดรัด (วงสีเหลือง) -->
              ${compactDoingCardHtml}

              <!-- กล่องแชทคิวต่อด้านล่างแบบสลับฝั่งซ้าย-ขวา -->
              ${alternatingChatFeedHtml}
            </div>
          </section>
        `;
      }

      /**
       * หน้า 2: หน้าคิวของฉัน ("มาสคอต + รายละเอียด กำหนดส่งงาน และความคืบหน้าของคิว")
       */
      function renderMyQueuePage() {
        const queue = findQueueByCode(uiState.selectedQueueCode);
        if (!queue) {
          uiState.activeView = 'check';
          return renderCheckPage();
        }

        const details = computeMyQueueDetails(queue);
        const statusMeta = getStatusMeta(queue.status);
        const statusBadgeClass = statusMeta.badgeClass;
        const statusText = statusMeta.label;
        const statusCat = statusMeta.category;

        const heartBannerIcon = `<span class="text-[#DF6E97] text-sm leading-none" aria-hidden="true">♡</span>`;

        // ขั้นตอนความคืบหน้า 4 ระดับพร้อมลูกเล่น (วงสีฟ้า)
        const progressStages = [
          { step: 1, label: 'รับคิว', emoji: '💌' },
          { step: 2, label: 'รอคิว', emoji: '🎀' },
          { step: 3, label: 'กำลังทำ', emoji: '✨' },
          { step: 4, label: 'เสร็จแล้ว', emoji: '🌸' },
        ];

        const progressStepperHtml = progressStages
          .map((item) => {
            const isCompleted = details.progressStep > item.step || (item.step === 4 && statusCat === 'done');
            const isCurrent = details.progressStep === item.step && !isCompleted;

            const dotClass = isCompleted
              ? 'bg-gradient-to-br from-[#F997BC] to-[#E96A98] text-white border-[#EE79A3] shadow-sm'
              : isCurrent
              ? 'bg-white text-[#E46391] border-2 border-[#EE79A3] step-active-glow scale-110'
              : 'bg-[#FFF5F9] text-[#CBA9B5] border border-[#F0D4E0]';

            const labelClass = isCompleted || isCurrent ? 'text-cocoa font-semibold' : 'text-cocoa-soft';

            return `
              <div class="relative z-10 flex flex-col items-center gap-1 flex-1 pt-5">
                ${
                  isCurrent
                    ? `<span class="absolute top-0 text-[13px] leading-none step-bunny-bounce select-none" aria-hidden="true">🐰</span>`
                    : isCompleted
                    ? `<span class="absolute top-1 text-[9px] text-[#F28BB1] twinkle-soft select-none" aria-hidden="true">✦</span>`
                    : ''
                }
                <div class="w-7 h-7 rounded-full flex items-center justify-center text-[11px] font-cute font-bold transition-all ${dotClass}">
                  ${
                    isCompleted
                      ? `<svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>`
                      : isCurrent
                      ? `<span class="text-[12px] leading-none">${item.emoji}</span>`
                      : item.step
                  }
                </div>
                <span class="text-[11px] font-cute leading-none mt-0.5 ${labelClass}">${item.label}</span>
              </div>
            `;
          })
          .join('');

        return `
          <section class="page-enter">
            ${renderUnifiedBanner({ title: 'คิวของฉัน', iconSvg: heartBannerIcon, showBackBtn: true })}

            <div class="px-4 pt-2 space-y-3.5">
              <!-- กล่องข้อความน่ารักฝั่งซ้าย + มาสคอต PNG ฝั่งขวา (วงสีฟ้า) -->
              <div class="flex items-center gap-2.5">
                <div class="mascot-speech-cute flex-1 rounded-[1.75rem] px-4 py-4 min-h-[118px] flex items-center justify-center text-center">
                  <div class="w-full">
                    ${details.bubbleHtml}
                  </div>
                </div>

                <button
                  type="button"
                  id="interactive-mascot-btn"
                  aria-label="แตะมาสคอตเพื่อส่งกำลังใจ"
                  class="relative w-[39%] max-w-[146px] shrink-0 flex items-center justify-center cursor-pointer focus:outline-none group">
                  <div class="pointer-events-none absolute w-24 h-24 rounded-full bg-[#FFDCE9]/70 blur-xl group-hover:scale-110 transition-transform"></div>
                  <span class="pointer-events-none absolute top-1 left-1 text-[#F48BB2] text-xs twinkle-soft" aria-hidden="true">✦</span>
                  <span class="pointer-events-none absolute top-3 right-1 text-[#F7A1C1] text-[11px] twinkle-soft" style="animation-delay:0.7s" aria-hidden="true">♡</span>
                  <span class="pointer-events-none absolute bottom-1 right-2 text-[#F5B0CA] text-[10px] twinkle-soft" style="animation-delay:1.2s" aria-hidden="true">✦</span>
                  <div id="mascot-heart-layer" class="pointer-events-none absolute inset-0 overflow-visible"></div>
                  <div id="mascot-anim-wrap" class="w-full mascot-float">
                    ${renderMascotImage({
                      wrapperClass: 'w-full h-[132px]',
                      imgClass: 'scale-[1.06]',
                    })}
                  </div>
                </button>
              </div>

              <!-- การ์ด "คิวของคุณ" + ความคืบหน้า + กำหนดส่งงานและรายละเอียด (วงสีเขียว) -->
              <div class="clean-card rounded-[1.7rem] p-4 sm:p-5 space-y-4">
                <div class="text-center pb-3 border-b border-[#F8E6EE]">
                  <div class="flex items-center justify-center gap-1.5 font-cute font-medium text-[13px] text-cocoa-light">
                    ${renderQueueAvatar(queue, 'pink', 'w-6 h-6')}
                    <span>${queue.customerName ? `คิวของ ${escapeHtml(queue.customerName)}` : 'คิวของคุณ'}</span>
                  </div>
                  <div class="font-cute font-bold text-[38px] sm:text-[40px] text-cocoa tracking-wide leading-tight mt-0.5">
                    ${escapeHtml(queue.code)}
                  </div>
                  <div class="mt-2 flex justify-center">
                    <span class="inline-flex items-center justify-center px-4 py-1 rounded-full font-cute font-medium text-[12px] ${statusBadgeClass}">
                      ${escapeHtml(statusText)}
                    </span>
                  </div>
                </div>

                <!-- แถบความคืบหน้า 4 ขั้นตอน -->

        const usersBannerIcon = `
          <svg class="w-4 h-4 text-[#DF6E97] shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">

            <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>

        // การ์ดไฮไลต์ "กำลังทำ" พื้นชมพู

                    <div class="flex items-center gap-1.5">
                      <span class="relative flex h-2 w-2 shrink-0">
                        <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-[#E95B8E] opacity-75"></span>
                        <span class="relative inline-flex rounded-full h-2 w-2 bg-[#E95B8E]"></span>
                      </span>
                      <span class="text-[11px] font-cute font-medium text-[#C5557E]">กำลังดำเนินการ</span>
                    </div>
                    <div class="font-cute font-bold text-[19px] text-cocoa leading-tight">กำลังทำ</div>
                  </div>
                </div>

                <span class="shrink-0 bg-white border border-[#F5CBD9] text-cocoa font-cute font-bold text-[20px] px-4 py-1.5 rounded-full shadow-xs">

              </div>

              <div class="relative h-2 w-full rounded-full bg-white/75 overflow-hidden shimmer-bar">
                <div class="h-full rounded-full bg-gradient-to-r from-[#FBA4C3] to-[#EE73A0]" style="width: ${typeof doingQueue.progressPercent === 'number' ? doingQueue.progressPercent : 76}%"></div>
              </div>

              <div class="flex items-center justify-between text-[11px] font-cute text-[#A65373]">
                <span>แตะเพื่อดูรายละเอียดความคืบหน้า</span>
                <span>กำลังทำอยู่ค่ะ →</span>
              </div>
            </button>
          `
          : `
            <div class="doing-pink-card rounded-[1.5rem] p-4 text-center">
              <div class="flex justify-center mb-1">${getDoingFlowerSvg('w-7 h-7')}</div>

        // ปุ่มกรองสถานะ
        const filterButtons = [
          { id: 'all', label: 'ทั้งหมด', count: totalCount },
          { id: 'waiting', label: 'รอคิว', count: waitingQueues.length },
          { id: 'done', label: 'เสร็จแล้ว', count: doneQueues.length },
        ];

        const filterPillsHtml = `
          <div class="grid grid-cols-3 gap-2">
            ${filterButtons
              .map((f) => {
                const active = uiState.allQueueFilter === f.id;
                return `
                  <button
                    type="button"
                    data-all-filter="${f.id}"
                    class="py-2 px-2 rounded-full font-cute text-xs font-semibold flex items-center justify-center gap-1.5 transition-all cursor-pointer ${
                      active

              </div>
              ${waitingQueues
                .map((q, idx) => {
                  const bowVariant = waitingBows[idx % waitingBows.length];
                  const isNextUp = idx === 0;
                  const statusMeta = getStatusMeta(q.status);
                  return `
                    <div class="relative group">
                      ${
                        isNextUp
                          ? `
                            <span class="pointer-events-none absolute -left-[26px] top-1/2 -translate-y-1/2 w-5 h-5 rounded-full bg-gradient-to-br from-[#F993B9] to-[#E65F8F] border-2 border-white text-white text-[10px] flex items-center justify-center step-active-glow">

                          </div>
                        </div>

                          <span class="inline-flex items-center justify-center px-3 py-0.5 rounded-full font-cute font-medium text-[12px] ${statusMeta.badgeClass}">

                          </svg>
                        </div>
                      </button>
                    </div>
                  `;
                })
                .join('')}
            </div>
          `
          : `

              ยังไม่มีคิวที่รออยู่ในขณะนี้

        // กลุ่มคิวที่เสร็จแล้วด้านล่างใต้หัวข้อ "เสร็จแล้ว"

                    return `

                          <div class="w-9 h-9 flex items-center justify-center shrink-0 bg-transparent">

              ${showWaiting ? waitingListHtml : ''}
              ${showDone ? doneSectionHtml : ''}

          </section>
        `;

                <path d="M13.5 21v-8.2h2.75l.42-3.2H13.5V7.55c0-.93.26-1.56 1.6-1.56h1.7V3.13c-.3-.04-1.31-.13-2.49-.13-2.46 0-4.15 1.5-4.15 4.27v2.33H7.4v3.2h2.76V21h3.34z"/>

            cta: 'ติดตาม X ♡',
            iconSvg: `
              <svg class="w-4 h-4" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>
              </svg>

        };

        const channelsHtml = activeChannels.length
          ? `
            <div class="space-y-3">
              ${activeChannels
                .map((ch) => {
                  const st = themeStyles[ch.theme] || themeStyles.pink;

        return `
          <section class="page-enter">
            ${renderUnifiedBanner({ title: 'ติดต่อร้าน', iconSvg: chatBannerIcon })}

              <div class="clean-card rounded-[1.6rem] p-4 flex items-center gap-3">
